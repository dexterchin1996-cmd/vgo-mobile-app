<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo - 东南亚品质生活与手艺人服务平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    /* 顶部导航与国家市场切换 */
    .app-header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #F59E0B 10%, #0D9488 50%, #0284C7 90%);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 22px; box-shadow: var(--shadow-card);
    }
    .market-pill-group {
      display: flex; background: #EEF2F6; padding: 3px; border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
    }
    .market-btn {
      border: none; background: transparent; padding: 5px 12px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 700; color: var(--color-text-sub); cursor: pointer; transition: all 0.2s;
    }
    .market-btn.active { background: #fff; color: var(--color-text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    /* 平台保障跑马灯 */
    .sla-banner {
      background: #EFF6FF; border-bottom: 1px solid #BFDBFE;
      padding: 8px 16px; display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: var(--color-primary-dark); font-weight: 700;
    }

    /* 双模大导航：精准找手艺人 vs 认证实体门店 */
    .mode-switch-bar {
      display: flex; margin: 12px 16px 8px; background: #E2E8F0; padding: 3px; border-radius: 14px;
    }
    .mode-switch-btn {
      flex: 1; padding: 10px; border: none; border-radius: 11px; background: transparent;
      font-size: 13.5px; font-weight: 800; color: var(--color-text-sub); cursor: pointer; transition: all 0.2s;
    }
    .mode-switch-btn.active { background: #fff; color: var(--color-text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* 四大手艺类目金刚区 */
    .category-pills {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 6px 16px 12px;
    }
    .cat-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 4px; background: #fff; border: 1.5px solid var(--color-border);
      border-radius: 14px; cursor: pointer; box-shadow: var(--shadow-card); transition: all 0.2s;
    }
    .cat-btn.active { border-color: var(--color-teal); background: var(--color-teal-light); }
    .cat-icon-box {
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 6px;
    }

    /* 服务卡片网格系统 */
    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
    .card-item {
      background: #fff; border-radius: 16px; border: 1px solid var(--color-border);
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      box-shadow: var(--shadow-card); transition: transform 0.15s, box-shadow 0.15s;
    }
    .card-item:active { transform: scale(0.98); }
    .card-thumb-wrap { position: relative; width: 100%; height: 115px; overflow: hidden; background: #CBD5E1; }
    .card-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .badge-float {
      position: absolute; top: 8px; left: 8px; background: rgba(13, 148, 136, 0.92);
      backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px;
    }
    .card-body-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .card-title-text { font-size: 13.5px; font-weight: 800; line-height: 1.35; margin-bottom: 4px; }
    .card-desc-text { font-size: 11px; color: var(--color-text-muted); line-height: 1.35; margin-bottom: 8px; flex: 1; }
    .artisan-mini-row {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-teal-dark);
      margin-bottom: 8px; font-weight: 700;
    }
    .artisan-mini-row img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .card-price-row {
      display: flex; align-items: baseline; justify-content: space-between;
      border-top: 1px dashed var(--color-border); padding-top: 8px;
    }
    .card-price-num { font-size: 16px; font-weight: 900; color: var(--color-danger); }
    .card-cta-btn {
      width: 26px; height: 26px; border-radius: 50%; border: none;
      background: var(--color-teal); color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 11px;
    }

    /* 认证商户专属横幅卡片 */
    .merchant-banner-card {
      grid-column: span 2; background: #fff; border-radius: 16px; border: 1.5px solid var(--color-border);
      overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow-card); cursor: pointer;
    }
    .merchant-cover-photo { width: 100%; height: 135px; object-fit: cover; }
    .merchant-detail-wrap { padding: 14px; }

    /* 真实客户评价推荐看板 */
    .reviews-hub-container {
      margin: 20px 16px 12px; background: #FFFBEB; border: 1.5px solid #FDE68A;
      border-radius: 16px; padding: 16px;
    }
    .review-bubble-card {
      background: #fff; border-radius: 12px; padding: 12px; margin-top: 10px;
      border: 1px solid #FEF3C7; font-size: 12px; line-height: 1.45;
    }
    .reviewer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .reviewer-user { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 12.5px; }
    .reviewer-user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    /* 抽屉与参数化选单 */
    .modal-scrim {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); z-index: 200;
      display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
    }
    .modal-sheet-box {
      width: 100%; max-width: 540px; background: #fff; border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto;
      animation: sheetPop 0.25s cubic-bezier(0, 0, 0.2, 1);
    }
    @keyframes sheetPop { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sop-step-box {
      background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 12px;
      padding: 10px 12px; margin: 10px 0; font-size: 11.5px; line-height: 1.5; color: var(--color-text-sub);
    }
    .option-chip {
      display: inline-block; padding: 6px 12px; border-radius: 8px; background: #F1F5F9;
      border: 1px solid var(--color-border); font-size: 12px; font-weight: 700; margin: 4px 6px 4px 0; cursor: pointer;
    }
    .option-chip.active { border-color: var(--color-teal); background: var(--color-teal-light); color: var(--color-teal); }
    .receipt-box {
      background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 12px;
      padding: 12px; margin: 14px 0; font-size: 12px;
    }
    .submit-order-btn {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: var(--color-teal); color: #fff; font-weight: 900; font-size: 15px; cursor: pointer;
    }

    /* 底部固定导航条 */
    .bottom-nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom); background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px); display: flex; border-top: 1px solid var(--color-border); z-index: 120;
    }
    .nav-cell-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--color-text-muted); font-size: 10px; font-weight: 600; cursor: pointer; gap: 3px;
    }
    .nav-cell-item.active { color: var(--color-teal); }
  </style>
</head>
<body>

  <!-- 轻量全局 Toast 通知容器 -->
  <div id="vgoToast" class="vgo-toast"><i class="fas fa-circle-check"></i> <span id="vgoToastText">系统提示</span></div>

  <!-- 顶部状态栏 -->
  <header class="app-header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="brand-mark">V</div>
      <div>
        <h1 style="font-size: 17px; font-weight: 900;">Vgo 平台</h1>
        <div style="font-size: 10.5px; color: var(--color-text-muted);"><i class="fas fa-location-dot" style="color: var(--color-teal);"></i> <span id="txtCityLoc">沙巴·亚庇 (Kota Kinabalu)</span></div>
      </div>
    </div>
    <div class="market-pill-group">
      <button class="market-btn active" id="btnMY" onclick="switchMarketRegion('MY')">🇲🇾 马来西亚</button>
      <button class="market-btn" id="btnSG" onclick="switchMarketRegion('SG')">🇸🇬 新加坡</button>
    </div>
  </header>

  <!-- 平台保障提示跑马灯 -->
  <div class="sla-banner" onclick="showToast('平台提供最高 90 天免费售后保固与实名执业核验', 'info')">
    <span><i class="fas fa-shield-halved"></i> 平台服务承诺：100%持证手艺人 · 价格透明 · 施工/服务售后质保</span>
    <span id="txtTaxBadge" style="text-decoration: underline;">含 8% SST <i class="fas fa-circle-info"></i></span>
  </div>

  <!-- 双模导航：找手艺人 vs 找实体门店 -->
  <div class="mode-switch-bar">
    <button class="mode-switch-btn active" id="tabModeArtisans" onclick="changeBrowseMode('artisans')">
      <i class="fas fa-user-check"></i> 精选手艺人 (兼职/上门预约)
    </button>
    <button class="mode-switch-btn" id="tabModeMerchants" onclick="changeBrowseMode('merchants')">
      <i class="fas fa-store"></i> 认证实体门店 (到店核销)
    </button>
  </div>

  <!-- 手艺人四大门类图标金刚区 -->
  <div class="category-pills" id="categoryNavRow">
    <div class="cat-btn active" id="cbtn_massage" onclick="selectSkillCategory('massage')">
      <div class="cat-icon-box" style="background: #CCFBF1; color: #0D9488;"><i class="fas fa-spa"></i></div>
      <span style="font-size: 11px; font-weight: 800;">理疗推拿</span>
    </div>
    <div class="cat-btn" id="cbtn_beauty" onclick="selectSkillCategory('beauty')">
      <div class="cat-icon-box" style="background: #FCE7F3; color: #DB2777;"><i class="fas fa-wand-magic-sparkles"></i></div>
      <span style="font-size: 11px; font-weight: 800;">美容美睫</span>
    </div>
    <div class="cat-btn" id="cbtn_pet" onclick="selectSkillCategory('pet')">
      <div class="cat-icon-box" style="background: #FEF3C7; color: #D97706;"><i class="fas fa-paw"></i></div>
      <span style="font-size: 11px; font-weight: 800;">宠物美容</span>
    </div>
    <div class="cat-btn" id="cbtn_handyman" onclick="selectSkillCategory('handyman')">
      <div class="cat-icon-box" style="background: #E0F2FE; color: #0284C7;"><i class="fas fa-wrench"></i></div>
      <span style="font-size: 11px; font-weight: 800;">水电急修</span>
    </div>
  </div>

  <!-- 主视图网格 (手艺人卡片或商户卡片) -->
  <div class="cards-grid" id="mainCardsGrid"></div>

  <!-- 真实顾客口碑反馈与推荐看板 -->
  <div class="reviews-hub-container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 14px; font-weight: 900; color: #92400E;"><i class="fas fa-comments"></i> 真实客户反馈与实名推荐</span>
      <span style="font-size: 11px; color: #B45309; font-weight: 700;">履约后真实评测</span>
    </div>
    <div id="reviewsListArea"></div>
  </div>

  <!-- 底部固定导航栏 -->
  <nav class="bottom-nav-bar">
    <div class="nav-cell-item active" onclick="showToast('已在服务大厅首页', 'info')"><i class="fas fa-compass"></i><span>服务大厅</span></div>
    <div class="nav-cell-item" onclick="showToast('暂无进行中的待履约工单', 'info')"><i class="fas fa-clipboard-check"></i><span>履约订单</span></div>
    <div class="nav-cell-item" onclick="openHotlineDrawer()"><i class="fas fa-headset"></i><span>调度客服</span></div>
    <div class="nav-cell-item" onclick="showToast('已通过移动端 Capacitor 原生沙箱认证', 'success')"><i class="fas fa-user-shield"></i><span>客户中心</span></div>
  </nav>

  <!-- SKU 参数化配置与派单抽屉 -->
  <div id="skuDrawer" class="modal-scrim">
    <div class="modal-sheet-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="font-size: 17px; font-weight: 900;" id="skuDrawerTitle">配置服务项目</h3>
        <button onclick="closeModal('skuDrawer')" style="border:none; background:none; font-size: 24px; cursor:pointer;">&times;</button>
      </div>

      <!-- 顶部图片与手艺人风采卡 -->
      <div style="border-radius: 14px; overflow: hidden; height: 140px; margin-bottom: 12px; position: relative;">
        <img id="skuDrawerHeroImg" src="" style="width: 100%; height: 100%; object-fit: cover;">
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); display: flex; align-items: flex-end; padding: 12px;">
          <div style="display: flex; align-items: center; gap: 8px; color: #fff;">
            <img id="skuDrawerArtisanAvatar" src="" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; object-fit: cover;">
            <div>
              <div style="font-weight: 900; font-size: 13px;" id="skuDrawerArtisanName">手艺人姓名</div>
              <div style="font-size: 10px; opacity: 0.9;" id="skuDrawerArtisanExp">资质与经验</div>
            </div>
          </div>
        </div>
      </div>

      <div style="font-size: 12px; color: var(--color-text-sub); margin-bottom: 10px;" id="skuDrawerDesc">服务介绍</div>

      <!-- 标准作业 SOP 提示 -->
      <div class="sop-step-box" id="skuDrawerSop"></div>

      <!-- 动态属性选项挂载区 -->
      <div id="skuDrawerOptionsArea"></div>

      <!-- 明细账单清单 -->
      <div class="receipt-box" id="skuDrawerReceipt"></div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px;">您的联系电话与姓名</label>
        <input type="text" id="custOrderPhone" style="width: 100%; padding: 12px; border: 1.5px solid var(--color-border); border-radius: 12px; font-size: 14px;" placeholder="例如：林女士 0128172166">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px;">服务详细地址 (或指定到店)</label>
        <input type="text" id="custOrderAddr" style="width: 100%; padding: 12px; border: 1.5px solid var(--color-border); border-radius: 12px; font-size: 14px;" placeholder="输入大厦/单元号，或期望就近区域">
      </div>

      <button class="submit-order-btn" onclick="executeSubmitDetailedOrder()">提交需求并匹配手艺人</button>
    </div>
  </div>

  <!-- 客服与调度中心抽屉 -->
  <div id="hotlineDrawer" class="modal-scrim">
    <div class="modal-sheet-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 17px; font-weight: 900;">Vgo 平台官方调度客服</h3>
        <button onclick="closeModal('hotlineDrawer')" style="border:none; background:none; font-size: 24px; cursor:pointer;">&times;</button>
      </div>
      <div style="padding: 14px; background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="fab fa-whatsapp" style="font-size: 26px; color: #25D366;"></i>
          <div>
            <div style="font-weight: 800; font-size: 13.5px;">WhatsApp 调度专线</div>
            <div style="font-size: 11px; color: var(--color-text-muted);">+60128172166 (24小时全天候)</div>
          </div>
        </div>
        <a href="https://wa.me/60128172166" target="_blank" style="color: var(--color-teal); font-weight: 800; text-decoration: none;">即刻沟通</a>
      </div>
      <div style="padding: 14px; background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 14px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="fas fa-phone-volume" style="font-size: 20px; color: var(--color-orange);"></i>
          <div>
            <div style="font-weight: 800; font-size: 13.5px;">24H 突发抢修调度热线</div>
            <div style="font-size: 11px; color: var(--color-text-muted);">01172691788 (一键拨通)</div>
          </div>
        </div>
        <a href="tel:01172691788" style="color: var(--color-orange); font-weight: 800; text-decoration: none;">立即拨打</a>
      </div>
    </div>
  </div>

  <script src="../modules/catalogDatabase.js"></script>
  <script src="../modules/pricingEngine.js"></script>
  <script src="../modules/merchantSyncEngine.js"></script>

  <script>
    let currentMarket = 'MY';
    let currentMode = 'artisans';
    let currentSkill = 'massage';
    let currentActiveSku = null;
    let selectedOptions = [];

    // 轻量原生 Toast 提示引擎
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('vgoToast');
      const text = document.getElementById('vgoToastText');
      text.innerText = msg;
      toast.className = 'vgo-toast active';
      setTimeout(() => { toast.className = 'vgo-toast'; }, 2400);
    }

    function switchMarketRegion(m) {
      currentMarket = m;
      const info = window.vgoPricing.setRegion(m);
      document.getElementById('btnMY').classList.toggle('active', m === 'MY');
      document.getElementById('btnSG').classList.toggle('active', m === 'SG');
      document.getElementById('txtCityLoc').innerText = info.city;
      document.getElementById('txtTaxBadge').innerHTML = `含 ${info.taxName} <i class="fas fa-circle-info"></i>`;
      renderDisplayGrid();
      showToast(`已切换至 ${info.city}`);
    }

    function changeBrowseMode(mode) {
      currentMode = mode;
      document.getElementById('tabModeArtisans').classList.toggle('active', mode === 'artisans');
      document.getElementById('tabModeMerchants').classList.toggle('active', mode === 'merchants');
      document.getElementById('categoryNavRow').style.display = mode === 'artisans' ? 'grid' : 'none';
      renderDisplayGrid();
    }

    function selectSkillCategory(skill) {
      currentSkill = skill;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('cbtn_' + skill);
      if (btn) btn.classList.add('active');
      renderDisplayGrid();
    }

    function renderDisplayGrid() {
      const grid = document.getElementById('mainCardsGrid');

      if (currentMode === 'artisans') {
        const items = window.vgoCatalog[currentSkill] || [];
        grid.innerHTML = items.map(item => {
          const rawPrice = currentMarket === 'MY' ? item.basePriceMY : item.basePriceSG;
          const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, [], item.category === 'handyman');

          return `
            <div class="card-item" onclick="openSkuModal('${item.id}')">
              <div class="card-thumb-wrap">
                <img src="${item.image}" alt="${item.name}" loading="lazy">
                <span class="badge-float">${item.badge}</span>
              </div>
              <div class="card-body-content">
                <div class="artisan-mini-row">
                  <img src="${item.artisanAvatar}" alt="${item.artisanName}">
                  <span>${item.artisanName} · ${item.artisanTitle}</span>
                </div>
                <div class="card-title-text">${item.name}</div>
                <div class="card-desc-text">${item.desc}</div>
                <div style="font-size: 10px; color: #64748B; margin-bottom: 8px;"><i class="fas fa-clock"></i> ${item.duration} · ${item.mode}</div>
                <div class="card-price-row">
                  <span class="card-price-num">${quote.currency} ${quote.finalTotal}</span>
                  <button class="card-cta-btn"><i class="fas fa-arrow-right"></i></button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        // 展示认证实体商户环境实拍与服务
        const merchants = window.vgoMerchantSync.getAllSyncedMerchants();
        grid.innerHTML = merchants.map(m => `
          <div class="merchant-banner-card" onclick="showToast('已选定【${m.name}】，前台支持随时到店核销')">
            <img class="merchant-cover-photo" src="${m.image || 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=600&auto=format&fit=crop&q=80'}" alt="${m.name}">
            <div class="merchant-detail-wrap">
              <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <span style="font-size: 11px; font-weight: 800; color: var(--color-teal); background: var(--color-teal-light); padding: 2px 7px; border-radius: 4px;">
                  <i class="fas fa-certificate"></i> 官方认证商户 (${m.verifiedCode})
                </span>
                <span style="font-size: 13px; font-weight: 900; color: #F59E0B;"><i class="fas fa-star"></i> ${m.rating} (${m.reviewsCount})</span>
              </div>
              <h3 style="font-size: 16px; font-weight: 900; margin: 8px 0 4px;">${m.name}</h3>
              <div style="font-size: 11.5px; color: #64748B; margin-bottom: 8px;"><i class="fas fa-location-dot"></i> ${m.address} · 营业：${m.openTime}</div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;">
                ${m.services.map(s => `<span style="font-size: 11px; background: #F1F5F9; padding: 3px 8px; border-radius: 6px; font-weight: 700;">${s}</span>`).join('')}
              </div>
              <div style="font-size: 11px; color: #0D9488; font-weight: 700;">
                <i class="fas fa-check-double"></i> 设施保障: ${m.amenities.join(' · ')}
              </div>
            </div>
          </div>
        `).join('');
      }

      renderReviewsSection();
    }

    function renderReviewsSection() {
      const box = document.getElementById('reviewsListArea');
      const list = window.vgoCatalog.reviews || [];
      box.innerHTML = list.map(r => `
        <div class="review-bubble-card">
          <div class="reviewer-header">
            <div class="reviewer-user">
              <img src="${r.avatar}">
              <span>${r.customer} → 约选 [${r.artisan}]</span>
            </div>
            <span style="color: #F59E0B; font-weight: 900;">★★★★★ 5.0</span>
          </div>
          <div style="color: #0F172A; font-size: 12px; margin: 6px 0;">"${r.content}"</div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: #64748B;">
            <div>${r.tags.map(t => `<span style="background:#FEF3C7; color:#B45309; padding:2px 6px; border-radius:4px; margin-right:4px; font-weight:700;">#${t}</span>`).join('')}</div>
            <div>${r.service} · ${r.date}</div>
          </div>
        </div>
      `).join('');
    }

    function openSkuModal(id) {
      let item = null;
      for (const k of ['massage', 'beauty', 'pet', 'handyman']) {
        item = (window.vgoCatalog[k] || []).find(x => x.id === id);
        if (item) break;
      }
      if (!item) return;
      currentActiveSku = item;
      selectedOptions = [];

      document.getElementById('skuDrawerTitle').innerText = item.name;
      document.getElementById('skuDrawerHeroImg').src = item.image;
      document.getElementById('skuDrawerArtisanAvatar').src = item.artisanAvatar;
      document.getElementById('skuDrawerArtisanName').innerText = `${item.artisanName} · ${item.artisanTitle}`;
      document.getElementById('skuDrawerArtisanExp').innerText = item.experience;
      document.getElementById('skuDrawerDesc').innerText = `${item.desc} (适用人群: ${item.targetAudience})`;
      document.getElementById('skuDrawerSop').innerHTML = `<strong><i class="fas fa-list-check"></i> 标准作业SOP规范：</strong><br>${item.sop.join(' → ')}`;

      // 渲染属性与定制耗材
      const optBox = document.getElementById('skuDrawerOptionsArea');
      let html = '';
      if (item.options) {
        for (const key in item.options) {
          const list = item.options[key];
          html += `<div style="margin-bottom: 10px;"><label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 4px;">可选耗材 / 规格服务：</label>`;
          list.forEach((opt, idx) => {
            const isObj = typeof opt === 'object';
            const name = isObj ? opt.name : opt;
            const extra = isObj ? (currentMarket === 'MY' ? opt.extraMY : opt.extraSG) : 0;
            const extraLabel = extra > 0 ? ` (+${currentMarket === 'MY' ? 'RM' : 'S$'}${extra})` : '';
            html += `<span class="option-chip ${idx === 0 ? 'active' : ''}" onclick="pickOptionChip(this, '${name}', ${extra})">${name}${extraLabel}</span>`;
          });
          html += `</div>`;
        }
      }
      optBox.innerHTML = html;
      updateReceipt();
      document.getElementById('skuDrawer').style.display = 'flex';
    }

    function pickOptionChip(el, name, extra) {
      const parent = el.parentNode;
      parent.querySelectorAll('.option-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      selectedOptions = [];
      document.querySelectorAll('.option-chip.active').forEach(c => selectedOptions.push({ name: c.innerText }));
      updateReceipt();
    }

    function updateReceipt() {
      if (!currentActiveSku) return;
      const rawPrice = currentMarket === 'MY' ? currentActiveSku.basePriceMY : currentActiveSku.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, selectedOptions, currentActiveSku.category === 'handyman');

      document.getElementById('skuDrawerReceipt').innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>基础手艺服务工时费</span>
          <span>${quote.currency} ${quote.base}.00</span>
        </div>
        ${quote.urgentFee > 0 ? `<div style="display: flex; justify-content: space-between; margin-bottom: 4px; color: #EA580C;"><span>突发时段应急抢险保障费</span><span>+${quote.currency} ${quote.urgentFee}.00</span></div>` : ''}
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px; color: #64748B;">
          <span>法定服务税 (${quote.taxName})</span>
          <span>+${quote.currency} ${quote.taxAmount}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 14.5px; border-top: 1px dashed #CBD5E1; padding-top: 6px; margin-top: 6px;">
          <span>预估总计金额 (含税账单)</span>
          <span style="color: #DC2626;">${quote.currency} ${quote.finalTotal}</span>
        </div>
      `;
    }

    function executeSubmitDetailedOrder() {
      const phone = document.getElementById('custOrderPhone').value.trim() || '尊贵客户';
      const addr = document.getElementById('custOrderAddr').value.trim() || '客户定位地址';
      const rawPrice = currentMarket === 'MY' ? currentActiveSku.basePriceMY : currentActiveSku.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, selectedOptions, currentActiveSku.category === 'handyman');

      closeModal('skuDrawer');
      showToast('🎉 工单已提交！正在调度指定手艺人...');

      const text = encodeURIComponent(`【Vgo 精准服务工单】\\n项目：${currentActiveSku.name}\\n指定手艺人：${currentActiveSku.artisanName}\\n客户联络：${phone}\\n作业地址：${addr}\\n预算明细：${quote.currency} ${quote.finalTotal} (${quote.taxName})\\n国家市场：${currentMarket}`);
      setTimeout(() => {
        window.location.href = `https://wa.me/60128172166?text=${text}`;
      }, 600);
    }

    function openHotlineDrawer() { document.getElementById('hotlineDrawer').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    window.onload = renderDisplayGrid;
  </script>
</body>
</html>
