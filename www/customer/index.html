<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo - 东南亚品质生活与手艺人服务超级平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    /* 顶部控制栏扩展语言选择 */
    .header-utility-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #0F172A; color: #fff; font-size: 11px;
    }
    .lang-btn {
      background: none; border: 1px solid #334155; color: #CBD5E1;
      padding: 2px 8px; border-radius: 6px; font-size: 10.5px; cursor: pointer;
    }
    .lang-btn.active { border-color: #0D9488; color: #2DD4BF; font-weight: 800; }

    /* 民宿房东专线特色横幅 */
    .airbnb-host-banner {
      margin: 10px 16px 6px; border-radius: 18px;
      background: linear-gradient(135deg, #FF385C 0%, #E00B41 100%);
      padding: 14px 16px; color: #fff; display: flex; align-items: center;
      justify-content: space-between; box-shadow: 0 4px 14px rgba(255, 56, 92, 0.25);
      cursor: pointer;
    }

    /* 女性专属安全开关卡片 */
    .ladies-safety-toggle-card {
      margin: 8px 16px 10px; background: #FDF2F8; border: 1.5px solid #FBCFE8;
      border-radius: 16px; padding: 10px 14px; display: flex; align-items: center;
      justify-content: space-between;
    }

    /* 电子发票折叠面板 */
    .invoice-accordion-box {
      background: #F8FAFC; border: 1px solid var(--color-border);
      border-radius: 14px; padding: 12px; margin: 12px 0;
    }

    /* 弹窗小票 */
    .receipt-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- 顶部超能工具栏：中英韩三语切换与新马市场 -->
  <div class="header-utility-bar">
    <div style="display:flex; gap:6px; align-items:center;">
      <i class="fas fa-globe" style="color:#0D9488;"></i>
      <button class="lang-btn active" id="btnLang_zh" onclick="setAppLanguage('zh')">中文</button>
      <button class="lang-btn" id="btnLang_en" onclick="setAppLanguage('en')">EN</button>
      <button class="lang-btn" id="btnLang_ko" onclick="setAppLanguage('ko')">한국어</button>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <span style="font-size:10px; color:#94A3B8;">货币市场:</span>
      <button class="lang-btn active" id="btnMY" onclick="switchMarket('MY')">🇲🇾 MYR</button>
      <button class="lang-btn" id="btnSG" onclick="switchMarket('SG')">🇸🇬 SGD</button>
    </div>
  </div>

  <!-- 主品牌状态栏 -->
  <header style="background:rgba(255,255,255,0.96); backdrop-filter:blur(12px); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--color-border); position:sticky; top:0; z-index:90;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, #F59E0B 10%, #0D9488 50%, #0284C7 90%); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px;">V</div>
      <div>
        <h1 style="font-size:16px; font-weight:900;" id="appHeaderTitle">Vgo 平台</h1>
        <div style="font-size:10.5px; color:#64748B;"><i class="fas fa-location-dot" style="color:#0D9488;"></i> <span id="locHeader">沙巴·亚庇 (Kota Kinabalu)</span></div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-press" style="background:#F0FDFA; border:1px solid #CCFBF1; color:#0D9488; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800;" onclick="triggerSafetySOS()">
        <i class="fas fa-shield-heart"></i> 安全中心
      </button>
    </div>
  </header>

  <!-- Airbnb 民宿房东急救专线入口 -->
  <div class="airbnb-host-banner btn-press" onclick="openAirbnbSection()">
    <div style="display:flex; align-items:center; gap:12px;">
      <i class="fab fa-airbnb" style="font-size:28px;"></i>
      <div>
        <div style="font-size:13.5px; font-weight:900;" id="txtAirbnbTitle">Airbnb 民宿房东 30分急救专线</div>
        <div style="font-size:10.5px; opacity:0.92;" id="txtAirbnbSub">房客突发爆管 / 智能锁卡死 / 空调不冷 · 线上全托管</div>
      </div>
    </div>
    <i class="fas fa-chevron-right" style="font-size:14px;"></i>
  </div>

  <!-- 女性专属安全约选 (Ladies-Only Safe Match) -->
  <div class="ladies-safety-toggle-card">
    <div style="display:flex; align-items:center; gap:8px;">
      <i class="fas fa-female" style="font-size:22px; color:#DB2777;"></i>
      <div>
        <div style="font-size:12.5px; font-weight:800; color:#831843;" id="txtLadiesTitle">全女专属安全约选</div>
        <div style="font-size:10.5px; color:#9D174D;" id="txtLadiesDesc">独居女性安心保障，仅指派通过严格实名背景核验的女手艺人</div>
      </div>
    </div>
    <input type="checkbox" id="ladiesToggleSwitch" style="width:20px; height:20px; accent-color:#DB2777; cursor:pointer;" onchange="handleLadiesToggle(this)">
  </div>

  <!-- 双模大导航：手艺人 vs 实体商户 -->
  <div style="display:flex; margin:4px 16px 8px; background:#E2E8F0; padding:3px; border-radius:14px;">
    <button class="btn-press" style="flex:1; padding:10px; border:none; border-radius:11px; background:#fff; font-size:13px; font-weight:800; color:#0F172A;" id="tabBtnArtisan" onclick="switchMainTab('artisans')">
      <i class="fas fa-user-check"></i> 精选手艺人 (上门/预约)
    </button>
    <button class="btn-press" style="flex:1; padding:10px; border:none; border-radius:11px; background:transparent; font-size:13px; font-weight:800; color:#64748B;" id="tabBtnMerchant" onclick="switchMainTab('merchants')">
      <i class="fas fa-store"></i> 认证实体门店 (到店核销)
    </button>
  </div>

  <!-- 四大手艺类目金刚区 -->
  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:6px 16px 10px;" id="skillsCategoryStrip">
    <div class="cat-btn active" id="cbtn_massage" onclick="pickSkillCat('massage')">
      <div style="width:38px; height:38px; border-radius:50%; background:#CCFBF1; color:#0D9488; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:5px;"><i class="fas fa-spa"></i></div>
      <span style="font-size:11px; font-weight:800;">理疗推拿</span>
    </div>
    <div class="cat-btn" id="cbtn_beauty" onclick="pickSkillCat('beauty')">
      <div style="width:38px; height:38px; border-radius:50%; background:#FCE7F3; color:#DB2777; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:5px;"><i class="fas fa-wand-magic-sparkles"></i></div>
      <span style="font-size:11px; font-weight:800;">美容美睫</span>
    </div>
    <div class="cat-btn" id="cbtn_pet" onclick="pickSkillCat('pet')">
      <div style="width:38px; height:38px; border-radius:50%; background:#FEF3C7; color:#D97706; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:5px;"><i class="fas fa-paw"></i></div>
      <span style="font-size:11px; font-weight:800;">宠物美容</span>
    </div>
    <div class="cat-btn" id="cbtn_handyman" onclick="pickSkillCat('handyman')">
      <div style="width:38px; height:38px; border-radius:50%; background:#E0F2FE; color:#0284C7; display:flex; align-items:center; justify-content:center; font-size:17px; margin-bottom:5px;"><i class="fas fa-wrench"></i></div>
      <span style="font-size:11px; font-weight:800;">水电急修</span>
    </div>
  </div>

  <!-- 服务网格瀑布流 -->
  <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding:0 16px;" id="mainCardsGrid"></div>

  <!-- 底部固定大拇指导航栏 -->
  <nav style="position:fixed; bottom:0; left:0; right:0; height:calc(56px + var(--safe-bottom)); padding-bottom:var(--safe-bottom); background:rgba(255,255,255,0.98); backdrop-filter:blur(16px); display:flex; border-top:1px solid var(--color-border); z-index:120;">
    <div class="dock-cell active" onclick="window.vgoDialog.toast('已在服务大厅')"><i class="fas fa-compass" style="font-size:18px;"></i><span>服务大厅</span></div>
    <div class="dock-cell" onclick="openOrderTrackerModal()"><i class="fas fa-clipboard-check" style="font-size:18px;"></i><span>履约订单</span></div>
    <div class="dock-cell" onclick="triggerSafetySOS()"><i class="fas fa-shield-heart" style="font-size:18px; color:#DB2777;"></i><span>安全守护</span></div>
    <div class="dock-cell" onclick="window.vgoDialog.showModalAlert('Vgo 客户账户', '已通过移动端 Capacitor 原生沙箱认证。<br>享有最高 RM100,000 平台履约意外承保。', { btnBg: '#0D9488' })"><i class="fas fa-user-shield" style="font-size:18px;"></i><span>客户中心</span></div>
  </nav>

  <!-- 居中视网膜配置抽屉 (集成 LHDN 电子发票) -->
  <div id="skuConfigModal" class="center-modal-scrim">
    <div class="center-modal-box" style="padding:0 18px 20px;">
      <div class="drag-handle-zone"><div class="drag-indicator"></div></div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:17px; font-weight:900;" id="cfgTitle">配置服务工单</h3>
        <button onclick="closeConfigModal()" style="border:none; background:none; font-size:24px; color:#94A3B8; cursor:pointer;">&times;</button>
      </div>

      <div style="border-radius:16px; overflow:hidden; height:130px; margin-bottom:12px; position:relative;">
        <img id="cfgHeroPhoto" src="" style="width:100%; height:100%; object-fit:cover;">
        <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,0.7), transparent); display:flex; align-items:flex-end; padding:12px; color:#fff;">
          <div style="font-weight:900; font-size:13px;" id="cfgArtisanInfo">手艺人信息</div>
        </div>
      </div>

      <div style="font-size:12px; color:var(--color-text-sub); margin-bottom:10px;" id="cfgDesc">服务介绍</div>

      <!-- 动态属性规格选项 -->
      <div id="cfgOptionsMount"></div>

      <!-- LHDN 电子发票企业报销勾选区 -->
      <div class="invoice-accordion-box">
        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleInvoiceBox()">
          <span style="font-size:12px; font-weight:800; color:#0369A1;"><i class="fas fa-receipt"></i> 需要开具 LHDN 电子发票 (企业报销)？</span>
          <i class="fas fa-chevron-down" id="invoiceArrow" style="font-size:11px; color:#94A3B8;"></i>
        </div>
        <div id="invoiceInputFields" style="display:none; margin-top:10px;">
          <input type="text" id="invCompany" placeholder="公司法定全称" style="width:100%; padding:8px 10px; border:1px solid #CBD5E1; border-radius:8px; font-size:12px; margin-bottom:6px;">
          <div style="display:flex; gap:6px;">
            <input type="text" id="invTIN" placeholder="LHDN 企业税号 (TIN)" style="flex:1; padding:8px 10px; border:1px solid #CBD5E1; border-radius:8px; font-size:12px;">
            <input type="text" id="invBRN" placeholder="商业注册号 (SSM/BRN)" style="flex:1; padding:8px 10px; border:1px solid #CBD5E1; border-radius:8px; font-size:12px;">
          </div>
        </div>
      </div>

      <!-- 实时明细小票 -->
      <div style="background:#F8FAFC; border:1px solid var(--color-border); border-radius:14px; padding:12px; margin:12px 0; font-size:12px;" id="cfgReceiptArea"></div>

      <input type="text" id="cfgCustPhone" placeholder="联系电话 (例: 0128172166)" style="width:100%; min-height:46px; padding:10px 14px; border:1.5px solid var(--color-border); border-radius:12px; font-size:14px; margin-bottom:10px;">
      <input type="text" id="cfgCustAddr" placeholder="现场详细作业地址 (或指定到店)" style="width:100%; min-height:46px; padding:10px 14px; border:1.5px solid var(--color-border); border-radius:12px; font-size:14px; margin-bottom:14px;">

      <button class="btn-press" style="width:100%; min-height:50px; background:#0D9488; color:#fff; border:none; border-radius:14px; font-weight:900; font-size:15px;" onclick="submitFinalOrder()">
        提交工单并匹配手艺人
      </button>
    </div>
  </div>

  <!-- 引入核心系统与业务库 -->
  <script src="../core/dialogEngine.js"></script>
  <script src="../modules/catalogDatabase.js"></script>
  <script src="../modules/pricingEngine.js"></script>
  <script src="../modules/merchantSyncEngine.js"></script>
  <script src="../modules/advancedSafety.js"></script>
  <script src="../modules/b2bInvoiceAndLang.js"></script>

  <script>
    let currentMarket = 'MY';
    let currentMainTab = 'artisans';
    let currentSkillKey = 'massage';
    let activeItem = null;
    let pickedOptions = [];
    let invoiceBoxOpen = false;

    function setAppLanguage(lang) {
      window.vgoLangB2B.setLanguage(lang);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btnLang_' + lang).classList.add('active');

      document.getElementById('appHeaderTitle').innerText = window.vgoLangB2B.t('appName');
      document.getElementById('txtAirbnbTitle').innerText = window.vgoLangB2B.t('airbnbTag');
      document.getElementById('txtAirbnbSub').innerText = window.vgoLangB2B.t('airbnbDesc');
      document.getElementById('txtLadiesTitle').innerText = window.vgoLangB2B.t('ladiesOnlyLabel');
      document.getElementById('txtLadiesDesc').innerText = window.vgoLangB2B.t('ladiesOnlyTip');

      renderMainGrid();
      window.vgoDialog.toast(`Language changed to ${lang.toUpperCase()}`);
    }

    function switchMarket(m) {
      currentMarket = m;
      const info = window.vgoPricing.setRegion(m);
      document.getElementById('btnMY').classList.toggle('active', m === 'MY');
      document.getElementById('btnSG').classList.toggle('active', m === 'SG');
      document.getElementById('locHeader').innerText = info.city;
      renderMainGrid();
      window.vgoDialog.toast(`市场已切换至 ${info.city}`);
    }

    function handleLadiesToggle(checkbox) {
      window.vgoSafety.toggleLadiesOnly(checkbox.checked);
      renderMainGrid();
    }

    function switchMainTab(tab) {
      currentMainTab = tab;
      document.getElementById('tabBtnArtisan').style.background = tab === 'artisans' ? '#fff' : 'transparent';
      document.getElementById('tabBtnArtisan').style.color = tab === 'artisans' ? '#0F172A' : '#64748B';
      document.getElementById('tabBtnMerchant').style.background = tab === 'merchants' ? '#fff' : 'transparent';
      document.getElementById('tabBtnMerchant').style.color = tab === 'merchants' ? '#0F172A' : '#64748B';
      document.getElementById('skillsCategoryStrip').style.display = tab === 'artisans' ? 'grid' : 'none';
      renderMainGrid();
    }

    function pickSkillCat(skill) {
      currentSkillKey = skill;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('cbtn_' + skill);
      if (btn) btn.classList.add('active');
      renderMainGrid();
    }

    function openAirbnbSection() {
      currentMainTab = 'artisans';
      currentSkillKey = 'airbnbHost';
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      renderMainGrid();
      window.vgoDialog.toast('已为您切换至【Airbnb 民宿房东 30 分钟急速救援专区】', 'info');
    }

    function renderMainGrid() {
      const grid = document.getElementById('mainCardsGrid');
      const currency = currentMarket === 'MY' ? 'RM' : 'S$';

      if (currentMainTab === 'artisans') {
        let items = window.vgoCatalog[currentSkillKey] || [];

        // 全女专属安全筛选过滤
        if (window.vgoSafety.ladiesOnlyActive) {
          items = items.filter(i => (i.artisanName && (i.artisanName.includes('Lisa') || i.artisanName.includes('Queenie') || i.artisanName.includes('敏') || i.artisanName.includes('姐'))));
        }

        grid.innerHTML = items.map(item => {
          const rawPrice = currentMarket === 'MY' ? item.basePriceMY : item.basePriceSG;
          const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, [], item.category === 'handyman' || item.category === 'airbnbHost');

          return `
            <div class="ergo-sku-box btn-press" onclick="openConfigModal('${item.id}')">
              <div class="sku-img-wrapper">
                <img src="${item.image}" alt="${item.name}" loading="lazy">
                <span class="badge-float-tag">${item.badge}</span>
              </div>
              <div class="sku-details-body">
                <div class="artisan-badge-line">
                  <img src="${item.artisanAvatar}" alt="${item.artisanName}">
                  <span>${item.artisanName}</span>
                </div>
                <div style="font-size: 13.5px; font-weight: 800; line-height: 1.35; margin-bottom: 4px;">${item.name}</div>
                <div style="font-size: 11px; color: #64748B; line-height: 1.35; margin-bottom: 8px;">${item.desc}</div>
                <div class="sku-price-strip">
                  <span class="sku-price-text">${quote.currency} ${quote.finalTotal}</span>
                  <button class="btn-circle-cta"><i class="fas fa-arrow-right"></i></button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        const merchants = window.vgoMerchantSync.getAllSyncedMerchants();
        grid.innerHTML = merchants.map(m => `
          <div class="merchant-display-card btn-press" onclick="window.vgoDialog.showModalAlert('选定实体门店', '【${m.name}】<br>地址：${m.address}<br>支持到店出示订单随时核销。', { btnBg: '#0D9488' })">
            <img class="merchant-photo-cover" src="${m.image || 'https://images.unsplash.com/photo-1540555700478-4be289fbecef?w=600&auto=format&fit=crop&q=80'}">
            <div class="merchant-info-pad">
              <h3 style="font-size: 16px; font-weight: 900; margin-bottom: 4px;">${m.name}</h3>
              <div style="font-size: 11.5px; color: #64748B;"><i class="fas fa-location-dot"></i> ${m.address}</div>
            </div>
          </div>
        `).join('');
      }
    }

    function openConfigModal(id) {
      let found = null;
      for (const k in window.vgoCatalog) {
        if (Array.isArray(window.vgoCatalog[k])) {
          found = window.vgoCatalog[k].find(x => x.id === id);
          if (found) break;
        }
      }
      if (!found) return;
      activeItem = found;
      pickedOptions = [];

      document.getElementById('cfgTitle').innerText = found.name;
      document.getElementById('cfgHeroPhoto').src = found.image;
      document.getElementById('cfgArtisanInfo').innerText = `${found.artisanName} · ${found.artisanTitle}`;
      document.getElementById('cfgDesc').innerText = found.desc;

      // 渲染规格选项
      const optMount = document.getElementById('cfgOptionsMount');
      let html = '';
      if (found.options) {
        for (const key in found.options) {
          const list = found.options[key];
          html += `<div style="margin-bottom:8px;"><label style="font-size:12px; font-weight:800;">服务耗材 / 规格定制：</label><br>`;
          list.forEach((opt, idx) => {
            const isObj = typeof opt === 'object';
            const name = isObj ? opt.name : opt;
            const extra = isObj ? (currentMarket === 'MY' ? opt.extraMY : opt.extraSG) : 0;
            const extraLabel = extra > 0 ? ` (+${currentMarket === 'MY' ? 'RM' : 'S$'}${extra})` : '';
            html += `<span class="spec-chip ${idx === 0 ? 'active' : ''}" onclick="pickModalSpec(this, '${name}', ${extra})">${name}${extraLabel}</span>`;
          });
          html += `</div>`;
        }
      }
      optMount.innerHTML = html;
      refreshConfigReceipt();

      document.getElementById('skuConfigModal').classList.add('active');
    }

    function pickModalSpec(el, name, extra) {
      el.parentNode.querySelectorAll('.spec-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      pickedOptions = [];
      document.querySelectorAll('.spec-chip.active').forEach(c => pickedOptions.push({ name: c.innerText }));
      refreshConfigReceipt();
    }

    function refreshConfigReceipt() {
      if (!activeItem) return;
      const rawPrice = currentMarket === 'MY' ? activeItem.basePriceMY : activeItem.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, pickedOptions, activeItem.category === 'handyman' || activeItem.category === 'airbnbHost');

      document.getElementById('cfgReceiptArea').innerHTML = `
        <div class="receipt-line"><span>标准手艺工时费</span><span>${quote.currency} ${quote.base}.00</span></div>
        ${quote.urgentFee > 0 ? `<div class="receipt-line" style="color:#EA580C;"><span>30分钟急速抢险保障费</span><span>+${quote.currency} ${quote.urgentFee}.00</span></div>` : ''}
        <div class="receipt-line" style="color:#64748B;"><span>法定服务税 (${quote.taxName})</span><span>+${quote.currency} ${quote.taxAmount}</span></div>
        <div class="receipt-line" style="font-weight:900; font-size:14.5px; border-top:1px dashed #CBD5E1; padding-top:6px; margin-top:6px;">
          <span>预估总计金额 (含税明细)</span><span style="color:#DC2626;">${quote.currency} ${quote.finalTotal}</span>
        </div>
      `;
    }

    function toggleInvoiceBox() {
      invoiceBoxOpen = !invoiceBoxOpen;
      document.getElementById('invoiceInputFields').style.display = invoiceBoxOpen ? 'block' : 'none';
      document.getElementById('invoiceArrow').className = invoiceBoxOpen ? 'fas fa-chevron-up' : 'fas fa-chevron-down';
    }

    function closeConfigModal() {
      document.getElementById('skuConfigModal').classList.remove('active');
    }

    async function submitFinalOrder() {
      const phone = document.getElementById('cfgCustPhone').value.trim();
      const addr = document.getElementById('cfgCustAddr').value.trim();

      if (!phone) {
        window.vgoDialog.toast('请填写您的联系电话！', 'warn');
        return;
      }

      const rawPrice = currentMarket === 'MY' ? activeItem.basePriceMY : activeItem.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, pickedOptions, activeItem.category === 'handyman' || activeItem.category === 'airbnbHost');

      let invoiceText = '不需要发票';
      if (invoiceBoxOpen) {
        const comp = document.getElementById('invCompany').value.trim();
        const tin = document.getElementById('invTIN').value.trim();
        if (comp && tin) {
          invoiceText = `开具 LHDN e-Invoice: ${comp} (TIN: ${tin})`;
        }
      }

      const confirmed = await window.vgoDialog.confirm(
        '确认派发服务需求？',
        `项目：<strong>${activeItem.name}</strong><br>手艺人：${activeItem.artisanName}<br>含税金额：<span style="color:#DC2626; font-weight:900;">${quote.currency} ${quote.finalTotal} (${quote.taxName})</span><br><small style="color:#64748B;">${invoiceText}</small>`,
        { confirmText: '立即派单', cancelText: '检查修改' }
      );

      if (!confirmed) return;

      closeConfigModal();
      window.vgoDialog.toast('🎉 工单已提交！已接入 Vgo 安全履约中枢');

      const text = encodeURIComponent(`【Vgo 精准服务工单】\\n项目：${activeItem.name}\\n指定手艺人：${activeItem.artisanName}\\n客户联络：${phone}\\n作业地址：${addr || '定位地址附近'}\\n含税预算：${quote.currency} ${quote.finalTotal} (${quote.taxName})\\n企业报销：${invoiceText}\\n国家市场：${currentMarket}`);
      setTimeout(() => {
        window.location.href = `https://wa.me/60128172166?text=${text}`;
      }, 600);
    }

    function triggerSafetySOS() {
      const shareData = window.vgoSafety.generateLiveTripShareData('VG-LIVE-TRIP', 'Vgo 平台持证手艺人', '18分钟');
      window.vgoDialog.confirm(
        'Vgo 安全守护中枢',
        '• 支持将实时定位与手艺人信息一键发送至家人 WhatsApp<br>• 如遇紧急安全威胁，点击下方静默报警，平台将立即上报定位',
        {
          confirmText: '一键分享行程至家人',
          cancelText: '静默 SOS 调度报警',
          confirmBg: '#0D9488',
          iconClass: 'fas fa-shield-heart',
          iconColor: '#DB2777'
        }
      ).then(isShare => {
        if (isShare) {
          window.location.href = shareData.whatsappUrl;
        } else {
          window.vgoDialog.showModalAlert('SOS 报警信号已发出', '已将您的高精度 GPS 经纬度信息同步至 Vgo 24H 调度应急值班室及安全专员。', { iconClass: 'fas fa-bullhorn', btnBg: '#DC2626' });
        }
      });
    }

    window.onload = () => { renderMainGrid(); };
  </script>
</body>
</html>
