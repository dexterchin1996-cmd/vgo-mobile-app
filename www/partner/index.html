<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo Partner - 手艺人兼职接单中枢</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    body { background: #0F172A; color: #F8FAFC; }
    .partner-top {
      padding: 14px 16px; background: rgba(30, 41, 59, 0.95);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 50;
    }
    .skill-switch-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none;
    }
    .skill-role-chip {
      padding: 6px 14px; border-radius: 20px; background: #1E293B; border: 1px solid #334155;
      font-size: 11.5px; font-weight: 700; color: #94A3B8; cursor: pointer; flex-shrink: 0;
    }
    .skill-role-chip.active { background: #0D9488; color: #fff; border-color: #0D9488; }
    .wallet-card {
      margin: 10px 16px; background: linear-gradient(135deg, #1E293B, #0F172A);
      border: 1px solid #334155; border-radius: 18px; padding: 18px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .job-notice-card {
      margin: 12px 16px; background: #1E293B; border: 1.5px solid #0D9488;
      border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(13, 148, 136, 0.15);
    }
  </style>
</head>
<body>
  <div class="partner-top">
    <div style="font-size: 15px; font-weight: 800;"><i class="fas fa-id-badge" style="color: #0D9488;"></i> 手艺人工作台 · 兼职接单端</div>
    <span style="color: #10B981; font-weight: 800; font-size: 12px;">● 听单就绪中</span>
  </div>

  <!-- 手艺人自由切换工种 (一人多技能接单) -->
  <div class="skill-switch-bar">
    <div class="skill-role-chip active">💆 按摩理疗师</div>
    <div class="skill-role-chip">💅 美容美睫师</div>
    <div class="skill-role-chip">🐾 宠物美容师</div>
    <div class="skill-role-chip">🔧 水电快修师</div>
  </div>

  <!-- 额外收入钱包与提现 -->
  <div class="wallet-card">
    <div>
      <div style="font-size: 11px; color: #94A3B8;">本周兼职额外收益</div>
      <div style="font-size: 22px; font-weight: 900; color: #10B981; margin-top: 4px;">RM 648.50</div>
    </div>
    <button style="border:none; background:#0D9488; color:#fff; padding:8px 16px; border-radius:12px; font-weight:800; font-size:12px;" onclick="alert('提现已发起至绑定的 DuitNow / 银行账户')">立即提现</button>
  </div>

  <div style="padding: 0 16px; font-size: 13px; font-weight: 800; color: #94A3B8; margin-top: 10px;">平台实时派发就近工单</div>

  <div class="job-notice-card">
    <span style="background: #0D9488; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;">经络推拿 · 上门单</span>
    <div style="font-size: 15px; font-weight: 900; margin-top: 8px;">中式经络穴位推拿 60分钟</div>
    <div style="font-size: 12px; color: #94A3B8; margin: 6px 0;">📍 亚庇市中心 滨海公寓 · 距离您 1.5 km</div>
    <div style="font-size: 16px; font-weight: 900; color: #F87171;">预计到手收益: RM 88.00</div>
    <button style="width:100%; padding:14px; border:none; border-radius:12px; background:#0D9488; color:#fff; font-weight:900; font-size:15px; margin-top:10px; cursor:pointer;" onclick="alert('🎉 抢单成功！请准时联系客户并前往履约。')">立即抢单</button>
  </div>
</body>
</html>
