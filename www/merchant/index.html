<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo Merchant - 实体商户数字化中台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    body { background: #F1F5F9; color: var(--color-text-main); padding-bottom: calc(75px + var(--safe-bottom)); user-select: none; }
    .merchant-bar {
      position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--color-border);
    }
    .panel-box { background: #fff; border-radius: 18px; padding: 18px; border: 1px solid var(--color-border); margin: 12px 16px; }
  </style>
</head>
<body>

  <header class="merchant-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg, #0D9488, #0284C7); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900;">店</div>
      <div>
        <div style="font-size:14px; font-weight:900;" id="mStoreName">绿意美学·经络生活馆</div>
        <div style="font-size:10px; color:#64748B;">SSM-202401889K · 平台抽成 10%</div>
      </div>
    </div>
    <button class="btn-press" style="background:#0D9488; color:#fff; border:none; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800;" onclick="openStandeeModal()">
      <i class="fas fa-print"></i> 打印前台立牌
    </button>
  </header>

  <div class="panel-box">
    <div style="font-size:14px; font-weight:900; margin-bottom:6px;"><i class="fas fa-qrcode" style="color:#0D9488;"></i> 极速扫码验单核销台</div>
    <div style="font-size:11.5px; color:#64748B; margin-bottom:12px;">支持出示顾客 6 位验证码核销，资金即时进入今日待结算银行对账单。</div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="verifyInput" maxlength="6" placeholder="输入6位核销码" style="flex:1; min-height:44px; background:#F8FAFC; border:1.5px solid var(--color-border); border-radius:12px; text-align:center; font-size:18px; letter-spacing:4px; font-weight:900; outline:none;">
      <button class="btn-press" style="background:#0D9488; color:#fff; border:none; padding:0 20px; border-radius:12px; font-weight:800; font-size:13px;" onclick="verifyAction()">核销</button>
    </div>
  </div>

  <!-- 模态框：前台亚克力立牌海报生成器 -->
  <div id="standeeModal" class="center-modal-scrim">
    <div class="center-modal-box" style="padding:20px; text-align:center;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 style="font-size:16px; font-weight:900;">门店前台亚克力立牌海报</h3>
        <button onclick="closeStandeeModal()" style="border:none; background:none; font-size:22px; color:#94A3B8; cursor:pointer;">&times;</button>
      </div>
      <p style="font-size:11px; color:#64748B; margin-bottom:12px;">直接保存图片并打印置于前台，进店散客扫码领券变私域，永久锁定客源分红！</p>
      
      <canvas id="standeeCanvas" style="width:100%; max-width:320px; border-radius:14px; box-shadow:0 4px 16px rgba(0,0,0,0.15); display:block; margin:0 auto 12px;"></canvas>

      <button class="btn-press" style="width:100%; min-height:46px; background:#0D9488; color:#fff; border:none; border-radius:12px; font-weight:900; font-size:14px;" onclick="downloadStandee()">
        <i class="fas fa-download"></i> 保存高清立牌海报图片
      </button>
    </div>
  </div>

  <script src="../core/dialogEngine.js"></script>
  <script src="../modules/growthEngine.js"></script>

  <script>
    function verifyAction() {
      const code = document.getElementById('verifyInput').value.trim();
      if (code.length === 6) {
        window.vgoDialog.showModalAlert('核销成功！', '工单验收完成！扣除 10% 平台服务费后的净收益已清算至 DuitNow 银行对账流水。', { btnBg: '#0D9488' });
        document.getElementById('verifyInput').value = '';
      } else {
        window.vgoDialog.toast('请输入完整的6位核销码', 'warn');
      }
    }

    function openStandeeModal() {
      const canvas = document.getElementById('standeeCanvas');
      window.vgoGrowth.generateMerchantStandee(canvas, document.getElementById('mStoreName').innerText, 'VGO-STORE-889');
      document.getElementById('standeeModal').classList.add('active');
    }

    function closeStandeeModal() {
      document.getElementById('standeeModal').classList.remove('active');
    }

    function downloadStandee() {
      const canvas = document.getElementById('standeeCanvas');
      const link = document.createElement('a');
      link.download = 'Vgo-Merchant-Standee.jpg';
      link.href = canvas.toDataURL('image/jpeg');
      link.click();
      window.vgoDialog.toast('已触发立牌图片保存下载！');
    }
  </script>
</body>
</html>
