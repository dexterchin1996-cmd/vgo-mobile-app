<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo - 手艺人技能撮合与实体商户服务平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    :root {
      --theme-teal: #0D9488;
      --theme-teal-light: #CCFBF1;
      --theme-orange: #EA580C;
      --theme-orange-light: #FFEDD5;
      --theme-blue: #0284C7;
      --theme-blue-light: #E0F2FE;
    }
    .header-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(12px);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--color-border);
    }
    .brand-cluster { display: flex; align-items: center; gap: 10px; }
    .brand-symbol {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg, #F59E0B 10%, #0D9488 50%, #0284C7 90%);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 24px; box-shadow: var(--shadow-md);
    }
    .market-pill-box {
      display: flex; background: #EEF2F6; padding: 3px; border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
    }
    .market-btn {
      border: none; background: transparent; padding: 6px 11px; border-radius: var(--radius-full);
      font-size: 11px; font-weight: 700; color: var(--color-text-sub); cursor: pointer;
    }
    .market-btn.active { background: #fff; color: var(--color-text-main); box-shadow: var(--shadow-sm); }

    /* 平台双模切换：精准找手艺人 vs 探索实体门店 */
    .dual-mode-tabs {
      display: flex; margin: 12px 16px 8px; background: #E2E8F0; padding: 3px; border-radius: 14px;
    }
    .dual-tab-btn {
      flex: 1; padding: 10px; border: none; border-radius: 11px; background: transparent;
      font-size: 13.5px; font-weight: 800; color: var(--color-text-sub); cursor: pointer; transition: all 0.2s;
    }
    .dual-tab-btn.active { background: #fff; color: var(--color-text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* 四大手艺人门类图标条 */
    .artisan-category-nav {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 6px 16px 12px;
    }
    .cat-btn-card {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 4px; background: #fff; border: 1.5px solid var(--color-border);
      border-radius: 14px; cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.2s;
    }
    .cat-btn-card.active { border-color: var(--theme-teal); background: var(--theme-teal-light); }
    .cat-icon-round {
      width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 6px;
    }

    /* 服务瀑布流卡片 */
    .services-grid-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px; }
    .sku-card {
      background: #fff; border-radius: 16px; border: 1px solid var(--color-border);
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
      box-shadow: var(--shadow-sm); transition: transform 0.15s;
    }
    .sku-card:active { transform: scale(0.98); }
    .sku-header-tag {
      padding: 8px 10px; background: #F8FAFC; border-bottom: 1px solid #F1F5F9;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sku-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
    .sku-title { font-size: 13.5px; font-weight: 800; line-height: 1.35; margin-bottom: 6px; }
    .sku-desc { font-size: 11px; color: var(--color-text-muted); line-height: 1.35; margin-bottom: 8px; flex: 1; }
    .sku-footer {
      display: flex; align-items: baseline; justify-content: space-between;
      border-top: 1px dashed var(--color-border); padding-top: 8px;
    }
    .sku-price { font-size: 16px; font-weight: 900; color: var(--color-danger); }

    /* 认证实体门店卡片 */
    .merchant-card-row {
      grid-column: span 2; background: #fff; border-radius: 16px; border: 1.5px solid var(--color-border);
      padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); cursor: pointer;
    }
    .badge-verified {
      font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      background: var(--theme-teal-light); color: var(--theme-teal);
    }

    /* 真实客户评价推荐看板 */
    .reviews-hub-box {
      margin: 20px 16px 12px; background: #FFFBEB; border: 1.5px solid #FDE68A;
      border-radius: 16px; padding: 16px;
    }
    .review-item {
      background: #fff; border-radius: 12px; padding: 12px; margin-top: 10px;
      border: 1px solid #FEF3C7; font-size: 12px; line-height: 1.45;
    }

    /* 抽屉与参数化配置器 */
    .drawer-mask {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); z-index: 200;
      display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px);
    }
    .drawer-panel {
      width: 100%; max-width: 540px; background: #fff; border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(20px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto;
    }
    .opt-chip {
      display: inline-block; padding: 6px 12px; border-radius: 8px; background: #F1F5F9;
      border: 1px solid var(--color-border); font-size: 12px; font-weight: 700; margin: 4px 6px 4px 0; cursor: pointer;
    }
    .opt-chip.selected { border-color: var(--theme-teal); background: var(--theme-teal-light); color: var(--theme-teal); }
    .bill-receipt {
      background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 12px;
      padding: 12px; margin: 14px 0; font-size: 12px;
    }
    .btn-dispatch {
      width: 100%; padding: 15px; border: none; border-radius: 14px;
      background: var(--theme-teal); color: #fff; font-weight: 900; font-size: 15px; cursor: pointer;
    }
    .bottom-nav-hub {
      position: fixed; bottom: 0; left: 0; right: 0; height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom); background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px); display: flex; border-top: 1px solid var(--color-border); z-index: 120;
    }
    .nav-tab-cell {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--color-text-muted); font-size: 10px; font-weight: 600; cursor: pointer; gap: 3px;
    }
    .nav-tab-cell.active { color: var(--theme-teal); }
  </style>
</head>
<body>

  <!-- 顶部状态栏 -->
  <header class="header-bar">
    <div class="brand-cluster">
      <div class="brand-symbol">V</div>
      <div>
        <h1 style="font-size: 17px; font-weight: 900;">Vgo 平台</h1>
        <div style="font-size: 10.5px; color: var(--color-text-muted);"><i class="fas fa-location-dot" style="color: var(--theme-teal);"></i> <span id="locBanner">沙巴·亚庇 (Kota Kinabalu)</span></div>
      </div>
    </div>
    <div class="market-pill-box">
      <button class="market-btn active" id="btnMY" onclick="switchMarket('MY')">🇲🇾 马来西亚</button>
      <button class="market-btn" id="btnSG" onclick="switchMarket('SG')">🇸🇬 新加坡</button>
    </div>
  </header>

  <!-- 双模导航：精准手艺人 vs 认证实体门店 -->
  <div class="dual-mode-tabs">
    <button class="dual-tab-btn active" id="tabArtisans" onclick="setDualMode('artisans')">
      <i class="fas fa-user-check"></i> 精选手艺人 (兼职上门/预约)
    </button>
    <button class="dual-tab-btn" id="tabMerchants" onclick="setDualMode('merchants')">
      <i class="fas fa-store"></i> 认证实体门店 (到店核销)
    </button>
  </div>

  <!-- 手艺人四大主流大类导航 (理疗推拿 / 美容美睫 / 宠物洗护 / 水电急修) -->
  <div class="artisan-category-nav" id="categoryNavPanel">
    <div class="cat-btn-card active" id="cbtn_massage" onclick="selectSkill('massage')">
      <div class="cat-icon-round" style="background: #CCFBF1; color: #0D9488;"><i class="fas fa-spa"></i></div>
      <span style="font-size: 11px; font-weight: 800;">理疗推拿</span>
    </div>
    <div class="cat-btn-card" id="cbtn_beauty" onclick="selectSkill('beauty')">
      <div class="cat-icon-round" style="background: #FCE7F3; color: #DB2777;"><i class="fas fa-wand-magic-sparkles"></i></div>
      <span style="font-size: 11px; font-weight: 800;">美容美睫</span>
    </div>
    <div class="cat-btn-card" id="cbtn_pet" onclick="selectSkill('pet')">
      <div class="cat-icon-round" style="background: #FEF3C7; color: #D97706;"><i class="fas fa-paw"></i></div>
      <span style="font-size: 11px; font-weight: 800;">宠物美容</span>
    </div>
    <div class="cat-btn-card" id="cbtn_handyman" onclick="selectSkill('handyman')">
      <div class="cat-icon-round" style="background: #E0F2FE; color: #0284C7;"><i class="fas fa-wrench"></i></div>
      <span style="font-size: 11px; font-weight: 800;">水电急修</span>
    </div>
  </div>

  <!-- 动态服务项目/商户大厅网格 -->
  <div class="services-grid-box" id="mainDisplayGrid"></div>

  <!-- 真实客户评价推荐看板 -->
  <div class="reviews-hub-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 14px; font-weight: 900; color: #92400E;"><i class="fas fa-comments"></i> 真实客户反馈与高光推荐</span>
      <span style="font-size: 11px; color: #B45309; font-weight: 700;">履约后真实评测</span>
    </div>
    <div id="reviewsList"></div>
  </div>

  <!-- 底部固定导航 -->
  <nav class="bottom-nav-hub">
    <div class="nav-tab-cell active" onclick="alert('已在大厅')"><i class="fas fa-compass"></i><span>服务大厅</span></div>
    <div class="nav-tab-cell" onclick="alert('暂无正在履约中的工单')"><i class="fas fa-clipboard-check"></i><span>履约订单</span></div>
    <div class="nav-tab-cell" onclick="openHotlineDrawer()"><i class="fas fa-headset"></i><span>调度客服</span></div>
    <div class="nav-tab-cell" onclick="alert('已通过移动端 Capacitor 原生沙箱认证')"><i class="fas fa-user-shield"></i><span>客户中心</span></div>
  </nav>

  <!-- 定制 SKU 属性与下单抽屉 -->
  <div id="customSkuDrawer" class="drawer-mask">
    <div class="drawer-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h3 style="font-size: 17px; font-weight: 900;" id="drawerItemName">配置服务工单</h3>
        <button onclick="closeDrawer('customSkuDrawer')" style="border:none; background:none; font-size: 22px; cursor:pointer;">&times;</button>
      </div>
      <div style="font-size: 11.5px; color: var(--color-text-sub); margin-bottom: 12px;" id="drawerItemSop">标准履约SOP</div>

      <!-- 动态属性选项挂载区 -->
      <div id="drawerOptionsArea"></div>

      <!-- 实时明细计算清单 -->
      <div class="bill-receipt" id="billReceiptArea"></div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px;">联系人姓名与电话</label>
        <input type="text" id="orderCustPhone" style="width: 100%; padding: 11px; border: 1.5px solid var(--color-border); border-radius: 12px; font-size: 13.5px;" placeholder="例如：林女士 0128172166">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 6px;">服务详细地址 (或指定到店)</label>
        <input type="text" id="orderCustAddress" style="width: 100%; padding: 11px; border: 1.5px solid var(--color-border); border-radius: 12px; font-size: 13.5px;" placeholder="输入大厦/单元号，或期望就近区域">
      </div>

      <button class="btn-dispatch" id="btnDispatchConfirm" onclick="submitDetailedJob()">提交工单并匹配手艺人</button>
    </div>
  </div>

  <!-- 客服调度抽屉 -->
  <div id="hotlineDrawer" class="drawer-mask">
    <div class="drawer-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 17px; font-weight: 900;">Vgo 平台统一调度中心</h3>
        <button onclick="closeDrawer('hotlineDrawer')" style="border:none; background:none; font-size: 22px; cursor:pointer;">&times;</button>
      </div>
      <div style="padding: 14px; background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="fab fa-whatsapp" style="font-size: 24px; color: #25D366;"></i>
          <div>
            <div style="font-weight: 800; font-size: 13.5px;">WhatsApp 调度专线</div>
            <div style="font-size: 11px; color: var(--color-text-muted);">+60128172166 (24小时全天候)</div>
          </div>
        </div>
        <a href="https://wa.me/60128172166" target="_blank" style="color: var(--theme-teal); font-weight: 800; text-decoration: none;">即刻发信</a>
      </div>
      <div style="padding: 14px; background: #F8FAFC; border: 1px solid var(--color-border); border-radius: 14px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="fas fa-phone-volume" style="font-size: 20px; color: var(--theme-orange);"></i>
          <div>
            <div style="font-weight: 800; font-size: 13.5px;">24H 应急抢修热线</div>
            <div style="font-size: 11px; color: var(--color-text-muted);">01172691788 (一键拨通)</div>
          </div>
        </div>
        <a href="tel:01172691788" style="color: var(--theme-orange); font-weight: 800; text-decoration: none;">直接拨打</a>
      </div>
    </div>
  </div>

  <script src="../modules/catalogDatabase.js"></script>
  <script src="../modules/pricingEngine.js"></script>
  <script src="../modules/merchantSyncEngine.js"></script>

  <script>
    let currentMarket = 'MY';
    let currentMode = 'artisans';
    let currentSkill = 'massage';
    let selectedSku = null;
    let selectedOptionsList = [];

    function switchMarket(m) {
      currentMarket = m;
      const info = window.vgoPricing.setRegion(m);
      document.getElementById('btnMY').classList.toggle('active', m === 'MY');
      document.getElementById('btnSG').classList.toggle('active', m === 'SG');
      document.getElementById('locBanner').innerText = info.city;
      renderMainGrid();
    }

    function setDualMode(mode) {
      currentMode = mode;
      document.getElementById('tabArtisans').classList.toggle('active', mode === 'artisans');
      document.getElementById('tabMerchants').classList.toggle('active', mode === 'merchants');
      document.getElementById('categoryNavPanel').style.display = mode === 'artisans' ? 'grid' : 'none';
      renderMainGrid();
    }

    function selectSkill(skill) {
      currentSkill = skill;
      document.querySelectorAll('.cat-btn-card').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('cbtn_' + skill);
      if (btn) btn.classList.add('active');
      renderMainGrid();
    }

    function renderMainGrid() {
      const container = document.getElementById('mainDisplayGrid');
      const currency = currentMarket === 'MY' ? 'RM' : 'S$';

      if (currentMode === 'artisans') {
        const items = window.vgoCatalog[currentSkill] || [];
        container.innerHTML = items.map(item => {
          const rawPrice = currentMarket === 'MY' ? item.basePriceMY : item.basePriceSG;
          const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, [], item.category === 'handyman');
          return `
            <div class="sku-card" onclick="openSkuCustomizer('${item.id}')">
              <div class="sku-header-tag">
                <span style="font-size: 11px; font-weight: 800; color: #0D9488;"><i class="fas fa-user-check"></i> ${item.artisanTitle}</span>
                <span style="font-size: 10px; background: #CCFBF1; color: #0D9488; padding: 2px 6px; border-radius: 4px; font-weight: 800;">${item.badge}</span>
              </div>
              <div class="sku-body">
                <div class="sku-title">${item.name}</div>
                <div class="sku-desc">${item.desc}</div>
                <div style="font-size: 10px; color: #64748B; margin-bottom: 8px;"><i class="fas fa-clock"></i> ${item.duration} · ${item.mode}</div>
                <div class="sku-footer">
                  <span class="sku-price">${quote.currency} ${quote.finalTotal}</span>
                  <button style="border:none; background: #0D9488; color:#fff; border-radius:50%; width:26px; height:26px;"><i class="fas fa-plus" style="font-size:11px;"></i></button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        // 展示认证入驻商户列表 (支持商家端动态同步上架)
        const merchants = window.vgoMerchantSync.getAllSyncedMerchants();
        container.innerHTML = merchants.map(m => `
          <div class="merchant-card-row" onclick="alert('已为您锁定门店：' + '${m.name}' + '\\n地址：' + '${m.address}' + '\\n服务项目：' + '${m.services.join(' / ')}')">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <span class="badge-verified"><i class="fas fa-certificate"></i> 平台官方认证 (${m.verifiedCode})</span>
                <h3 style="font-size: 15px; font-weight: 900; margin: 6px 0 2px;">${m.name}</h3>
                <div style="font-size: 11.5px; color: #64748B;"><i class="fas fa-location-dot"></i> ${m.address} · 营业：${m.openTime}</div>
              </div>
              <div style="font-size: 13px; font-weight: 900; color: #F59E0B; text-align: right;">
                <i class="fas fa-star"></i> ${m.rating}
                <div style="font-size: 10px; color: #94A3B8; font-weight: 600;">${m.reviewsCount}人已评价</div>
              </div>
            </div>
            <div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap;">
              ${m.services.map(s => `<span style="font-size: 11px; background: #F1F5F9; padding: 3px 8px; border-radius: 6px; font-weight: 700;">${s}</span>`).join('')}
            </div>
            <div style="margin-top: 8px; font-size: 10.5px; color: #0D9488; font-weight: 700;">
              设施保障: ${m.amenities.join(' · ')}
            </div>
          </div>
        `).join('');
      }

      renderReviewsBlock();
    }

    function renderReviewsBlock() {
      const revBox = document.getElementById('reviewsList');
      const list = window.vgoCatalog.reviews || [];
      revBox.innerHTML = list.map(r => `
        <div class="review-item">
          <div style="display: flex; justify-content: space-between; font-weight: 800; color: #92400E;">
            <span>${r.customer} → 约选 [${r.artisan}]</span>
            <span>★★★★★ 5.0</span>
          </div>
          <div style="margin: 4px 0; color: #0F172A; font-size: 11.5px;">"${r.content}"</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 10px; color: #64748B;">
            <div>${r.tags.map(t => `<span style="background:#FEF3C7; color:#B45309; padding:2px 6px; border-radius:4px; margin-right:4px;">#${t}</span>`).join('')}</div>
            <div>${r.service} · ${r.date}</div>
          </div>
        </div>
      `).join('');
    }

    function openSkuCustomizer(id) {
      let found = null;
      for (const k of ['massage', 'beauty', 'pet', 'handyman']) {
        found = (window.vgoCatalog[k] || []).find(x => x.id === id);
        if (found) break;
      }
      if (!found) return;
      selectedSku = found;
      selectedOptionsList = [];

      document.getElementById('drawerItemName').innerText = found.name;
      document.getElementById('drawerItemSop').innerHTML = `<strong>标准交付SOP：</strong> ${found.sop.join(' → ')}`;

      // 渲染属性与加价耗材选项
      const optContainer = document.getElementById('drawerOptionsArea');
      let html = '';
      if (found.options) {
        for (const optKey in found.options) {
          const val = found.options[optKey];
          html += `<div style="margin-bottom: 10px;"><label style="font-size: 12px; font-weight: 800; display: block; margin-bottom: 4px;">选择规格 / 属性：</label>`;
          val.forEach((optItem, idx) => {
            const isObj = typeof optItem === 'object';
            const name = isObj ? optItem.name : optItem;
            const extra = isObj ? (currentMarket === 'MY' ? optItem.extraMY : optItem.extraSG) : 0;
            const extraLabel = extra > 0 ? ` (+${currentMarket === 'MY' ? 'RM' : 'S$'}${extra})` : '';
            html += `<span class="opt-chip ${idx === 0 ? 'selected' : ''}" onclick="toggleOptionChip(this, '${name}', ${extra})">${name}${extraLabel}</span>`;
          });
          html += `</div>`;
        }
      }
      optContainer.innerHTML = html;
      recalculateDrawerBill();
      document.getElementById('customSkuDrawer').style.display = 'flex';
    }

    function toggleOptionChip(el, name, extra) {
      const parent = el.parentNode;
      parent.querySelectorAll('.opt-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      // 重新收集
      selectedOptionsList = [];
      document.querySelectorAll('.opt-chip.selected').forEach(c => {
        selectedOptionsList.push({ name: c.innerText });
      });
      recalculateDrawerBill();
    }

    function recalculateDrawerBill() {
      if (!selectedSku) return;
      const rawPrice = currentMarket === 'MY' ? selectedSku.basePriceMY : selectedSku.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, selectedOptionsList, selectedSku.category === 'handyman');

      document.getElementById('billReceiptArea').innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
          <span>基础服务工时费</span>
          <span>${quote.currency} ${quote.base}.00</span>
        </div>
        ${quote.urgentFee > 0 ? `<div style="display: flex; justify-content: space-between; margin-bottom: 4px; color: #EA580C;"><span>24H 应急抢修保障附加费</span><span>+${quote.currency} ${quote.urgentFee}.00</span></div>` : ''}
        <div style="display: flex; justify-content: space-between; margin-bottom: 4px; color: #64748B;">
          <span>法定税费 (${quote.taxName})</span>
          <span>+${quote.currency} ${quote.taxAmount}</span>
        </div>
        <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 14px; border-top: 1px dashed #CBD5E1; padding-top: 6px; margin-top: 6px;">
          <span>预估总计金额 (含税明细)</span>
          <span style="color: #DC2626;">${quote.currency} ${quote.finalTotal}</span>
        </div>
      `;
    }

    function submitDetailedJob() {
      const phone = document.getElementById('orderCustPhone').value.trim() || '尊贵客户';
      const addr = document.getElementById('orderCustAddress').value.trim() || '客户定位地址';
      const rawPrice = currentMarket === 'MY' ? selectedSku.basePriceMY : selectedSku.basePriceSG;
      const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, selectedOptionsList, selectedSku.category === 'handyman');

      closeDrawer('customSkuDrawer');
      alert(`🎉 工单已提交撮合池！明细金额: ${quote.currency} ${quote.finalTotal} (${quote.taxName})。正在调度专属手艺人接单！`);

      const text = encodeURIComponent(`【Vgo 精准工单】\\n项目：${selectedSku.name}\\n客户：${phone}\\n地址：${addr}\\n含税预算：${quote.currency} ${quote.finalTotal} (${quote.taxName})\\n国家市场：${currentMarket}`);
      window.location.href = `https://wa.me/60128172166?text=${text}`;
    }

    function openHotlineDrawer() { document.getElementById('hotlineDrawer').style.display = 'flex'; }
    function closeDrawer(id) { document.getElementById(id).style.display = 'none'; }

    window.onload = renderMainGrid;
  </script>
</body>
</html>
