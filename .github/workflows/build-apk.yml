name: Build Vgo Multi-Platform APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: "Vgo-Customer"
            package: "com.vgo.customer"
            entry: "VgoMainUI.html"
            display_name: "Vgo"
          - name: "Vgo-Partner"
            package: "com.vgo.partner"
            entry: "tech.html"
            display_name: "Vgo Partner"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure App Identity & Entry
        run: |
          echo "Configuring for ${{ matrix.app.name }}..."
          sed -i "s/\"appId\": \".*\"/\"appId\": \"${{ matrix.app.package }}\"/" capacitor.config.json || true
          sed -i "s/\"appName\": \".*\"/\"appName\": \"${{ matrix.app.display_name }}\"/" capacitor.config.json || true
          
          # 重定向默认加载入口
          mkdir -p public
          cp -r * public/ 2>/dev/null || true
          cp -f ${{ matrix.app.entry }} public/index.html

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
