name: Vgo Enterprise Android Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-android:
    name: Build Signed Release APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库完整源码
        uses: actions/checkout@v4

      - name: 安装生产环境 Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置编译环境 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 构建工具链与 SDK
        uses: android-actions/setup-android@v3

      - name: 安装工程依赖并同步 Web 容器镜像
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp -rf public/* www/

      - name: 检查并初始化 Capacitor 原生 Android 容器
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 执行解耦签名配置脚本
        run: |
          node scripts/configure-signing.js

      - name: 赋予 Gradle 脚本执行权限
        run: |
          cd android
          chmod +x gradlew

      - name: 编译 Android 生产产物 (Release AAB & Release APK)
        run: |
          cd android
          ./gradlew :app:bundleRelease :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: 归档上传 Google Play AAB 与 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Vgo-Production-Release-Package
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
