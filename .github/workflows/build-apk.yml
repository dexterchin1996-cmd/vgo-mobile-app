name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Vgo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Java JDK 环境 (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK 构建环境
        uses: android-actions/setup-android@v3

      - name: 依赖安装与静态资源镜像同步
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp -rf public/* www/

      - name: 初始化与同步 Capacitor Android 原生工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 赋予 Gradle 执行权限并执行 Debug APK 编译
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Vgo-Universal-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
