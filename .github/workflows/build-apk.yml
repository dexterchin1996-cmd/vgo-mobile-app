name: Build Vgo Multi-Platform APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: "Vgo-Customer"
            package: "com.vgo.customer"
            entry_dir: "public/customer"
            display_name: "Vgo"
          - name: "Vgo-Partner"
            package: "com.vgo.partner"
            entry_dir: "public/partner"
            display_name: "Vgo Partner"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inject Production Entry & Manifest
        run: |
          echo "Building target: ${{ matrix.app.name }} from ${{ matrix.app.entry_dir }}"
          # 清理并拷贝对应的核心端资产
          mkdir -p public www
          cp -rf ${{ matrix.app.entry_dir }}/* public/
          cp -rf ${{ matrix.app.entry_dir }}/* www/
          cp -f public/index.html index.html

          # 动态更新 Android 应用名称与包名
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ matrix.app.display_name }}</string>|g" android/app/src/main/res/values/strings.xml || true
          fi

      - name: Install Build Tools
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npm install --legacy-peer-deps

      - name: Sync Capacitor Android Assets
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
