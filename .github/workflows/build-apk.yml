name: Vgo Enterprise Android Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-production-android:
    name: Build Vgo Signed Release APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库完整源码
        uses: actions/checkout@v4

      - name: 安装生产环境 Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置编译环境 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android 构建工具链与 SDK
        uses: android-actions/setup-android@v3

      - name: 安装工程依赖与 Web 静态容器同步
        run: |
          npm install --legacy-peer-deps
          mkdir -p www
          cp -rf public/* www/

      - name: 检查并同步 Capacitor 原生 Android 容器
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 赋予 Gradle 脚本执行权限
        run: |
          cd android
          chmod +x gradlew

      - name: 编译 Debug 版 APK (用于真机本地快速验证)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 编译商用级 AAB (专供提交 Google Play 官方商店)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: 上传构建产物至 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vgo-Production-Packages
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
