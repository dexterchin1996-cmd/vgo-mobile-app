<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo Partner - 工程师与技师工作台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --partner-orange: #EA580C;
      --partner-dark: #C2410C;
      --bg-partner: #0F172A;
      --card-dark: #1E293B;
      --text-bright: #F8FAFC;
      --text-dim: #94A3B8;
      --success: #10B981;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-partner); color: var(--text-bright);
      padding-bottom: calc(75px + var(--safe-bottom)); user-select: none;
    }
    .header {
      padding: 14px 16px; background: rgba(30, 41, 59, 0.95);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 50;
    }
    .tech-id { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .status-toggle {
      background: #334155; border: none; padding: 6px 14px; border-radius: 20px;
      color: var(--success); font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .radar-box {
      margin: 16px; background: var(--card-dark); border-radius: 18px; padding: 20px;
      text-align: center; border: 1px solid #334155;
    }
    .radar-pulse {
      width: 70px; height: 70px; border-radius: 50%; background: rgba(234, 88, 12, 0.15);
      border: 2px solid var(--partner-orange); margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--partner-orange);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { transform: scale(0.95); } 50% { transform: scale(1.05); } 100% { transform: scale(0.95); } }
    .order-card {
      margin: 14px 16px; background: var(--card-dark); border: 1.5px solid #F97316;
      border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(234, 88, 12, 0.15);
    }
    .order-tag {
      display: inline-block; background: var(--partner-orange); color: #fff;
      font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px;
    }
    .btn-grab {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--partner-orange); color: #fff; font-weight: 900; font-size: 15px; margin-top: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="tech-id"><i class="fas fa-id-badge" style="color: var(--partner-orange);"></i> 工程师工作台 · 陈工</div>
    <button class="status-toggle" id="btnStatus" onclick="toggleWorkStatus()">● 接单就绪中</button>
  </div>

  <div class="radar-box">
    <div class="radar-pulse"><i class="fas fa-tower-broadcast"></i></div>
    <div style="font-size: 15px; font-weight: 800;">听单雷达持续工作中</div>
    <div style="font-size: 11.5px; color: var(--text-dim); margin-top: 4px;">当前高精度 GPS 定位覆盖：沙巴·亚庇滨海核心区 (5km)</div>
  </div>

  <div style="padding: 0 16px; font-size: 13px; font-weight: 800; color: var(--text-dim);">待抢急修工单 (实时推送)</div>

  <div class="order-card">
    <div class="order-tag">24H 突发抢修</div>
    <div style="font-size: 16px; font-weight: 900;">暗管破裂 / 严重漏水急修</div>
    <div style="font-size: 12px; color: var(--text-dim); margin: 6px 0;">📍 亚庇市中心 商业大厦 4 楼 · 距离您 1.2 km</div>
    <div style="font-size: 17px; font-weight: 900; color: #F87171;">预计收益: RM 86.40 (已含SST)</div>
    <button class="btn-grab" onclick="alert('🎉 抢单成功！已启动高精度路线导航，请在30分钟内抵达现场。')">即刻抢单</button>
  </div>

  <script>
    let isOnline = true;
    function toggleWorkStatus() {
      isOnline = !isOnline;
      const b = document.getElementById('btnStatus');
      if (isOnline) {
        b.style.color = '#10B981';
        b.innerText = '● 接单就绪中';
      } else {
        b.style.color = '#94A3B8';
        b.innerText = '○ 已停止听单';
      }
    }
  </script>
</body>
</html>
