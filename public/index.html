<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vgo - 东南亚品质生活与手艺人服务超级平台</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    .util-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #0F172A; color: #fff; font-size: 11px;
    }
    .util-btn {
      background: none; border: 1px solid #334155; color: #CBD5E1;
      padding: 2px 8px; border-radius: 6px; font-size: 10.5px; cursor: pointer;
    }
    .util-btn.active { border-color: #0D9488; color: #2DD4BF; font-weight: 800; }
    
    /* 订阅套餐专区横向卡片流 */
    .sub-plans-strip {
      display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none;
    }
    .sub-plans-strip::-webkit-scrollbar { display: none; }
    .sub-plan-card {
      flex: 0 0 260px; background: linear-gradient(135deg, #0F172A, #1E293B);
      border: 1.5px solid #334155; border-radius: 18px; padding: 14px; color: #fff;
      display: flex; flex-direction: column; justify-content: space-between; position: relative;
    }
    .sub-plan-badge {
      position: absolute; top: 12px; right: 12px; background: #F59E0B; color: #0F172A;
      font-size: 10px; font-weight: 900; padding: 2px 7px; border-radius: 6px;
    }

    /* 进门前贵重物品防盗免责卡 */
    .pre-entry-waiver-box {
      background: #FFFBEB; border: 1.5px solid #FDE68A; border-radius: 14px;
      padding: 12px; margin: 10px 0; font-size: 11.5px; line-height: 1.5; color: #92400E;
    }

    .ladies-card {
      margin: 6px 16px 10px; background: #FDF2F8; border: 1.5px solid #FBCFE8;
      border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
    }
  </style>
</head>
<body>

  <div class="util-topbar">
    <div style="display:flex; gap:6px; align-items:center;">
      <i class="fas fa-globe" style="color:#0D9488;"></i>
      <button class="util-btn active" id="btn_zh" onclick="switchLang('zh')">中文</button>
      <button class="util-btn" id="btn_en" onclick="switchLang('en')">EN</button>
      <button class="util-btn" id="btn_ko" onclick="switchLang('ko')">한국어</button>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="util-btn active" id="btnMY" onclick="switchRegion('MY')">🇲🇾 MYR</button>
      <button class="util-btn" id="btnSG" onclick="switchRegion('SG')">🇸🇬 SGD</button>
    </div>
  </div>

  <header style="background:rgba(255,255,255,0.96); backdrop-filter:blur(12px); padding:10px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--color-border); position:sticky; top:0; z-index:90;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, #F59E0B 10%, #0D9488 50%, #0284C7 90%); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px;">V</div>
      <div>
        <h1 style="font-size:16px; font-weight:900;">Vgo 平台</h1>
        <div style="font-size:10.5px; color:#64748B;"><i class="fas fa-location-dot" style="color:#0D9488;"></i> <span id="locHeader">沙巴·亚庇 (Kota Kinabalu)</span></div>
      </div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn-press" style="background:#F0FDFA; border:1px solid #CCFBF1; color:#0D9488; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800;" onclick="triggerSafetySOS()">
        <i class="fas fa-shield-heart"></i> 安全中心
      </button>
      <button class="btn-press" id="btnAuthTrigger" style="background:#0F172A; color:#fff; border:none; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:800;" onclick="openAuthModal()">
        <i class="fas fa-user-lock"></i> 登录/注册
      </button>
    </div>
  </header>

  <div style="padding: 10px 16px 4px; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-size:13px; font-weight:900; color:#0F172A;"><i class="fas fa-repeat" style="color:#0D9488;"></i> 尊享定期维保订阅计划 (包月/包年)</span>
    <span style="font-size:10.5px; color:#0D9488; font-weight:700;">省时立减 35%</span>
  </div>
  <div class="sub-plans-strip" id="subscriptionStrip">
    </div>

  <div class="ladies-card">
    <div style="display:flex; align-items:center; gap:8px;">
      <i class="fas fa-female" style="font-size:22px; color:#DB2777;"></i>
      <div>
        <div style="font-size:12.5px; font-weight:800; color:#831843;">全女专属安全约选</div>
        <div style="font-size:10px; color:#9D174D;">独居女性安心保障，仅指派通过严格实名无犯罪背调的女手艺人</div>
      </div>
    </div>
    <input type="checkbox" id="ladiesToggle" style="width:20px; height:20px; accent-color:#DB2777; cursor:pointer;" onchange="toggleLadiesSafeMatch(this)">
  </div>

  <div style="display:flex; margin:4px 16px 8px; background:#E2E8F0; padding:3px; border-radius:14px;">
    <button class="btn-press" style="flex:1; padding:9px; border:none; border-radius:11px; background:#fff; font-size:13px; font-weight:800;" id="tabBtnArtisans" onclick="switchCustomerTab('artisans')">
      <i class="fas fa-user-check"></i> 精选手艺人 (上门/预约)
    </button>
    <button class="btn-press" style="flex:1; padding:9px; border:none; border-radius:11px; background:transparent; font-size:13px; font-weight:800; color:#64748B;" id="tabBtnMerchants" onclick="switchCustomerTab('merchants')">
      <i class="fas fa-store"></i> 认证实体门店 (到店核销)
    </button>
  </div>

  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; padding:4px 16px 10px;" id="skillStrip">
    <div class="cat-btn active" id="cbtn_massage" onclick="selectCategory('massage')">
      <div style="width:36px; height:36px; border-radius:50%; background:#CCFBF1; color:#0D9488; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:4px;"><i class="fas fa-spa"></i></div>
      <span style="font-size:11px; font-weight:800;">理疗推拿</span>
    </div>
    <div class="cat-btn" id="cbtn_beauty" onclick="selectCategory('beauty')">
      <div style="width:36px; height:36px; border-radius:50%; background:#FCE7F3; color:#DB2777; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:4px;"><i class="fas fa-wand-magic-sparkles"></i></div>
      <span style="font-size:11px; font-weight:800;">美容美睫</span>
    </div>
    <div class="cat-btn" id="cbtn_pet" onclick="selectCategory('pet')">
      <div style="width:36px; height:36px; border-radius:50%; background:#FEF3C7; color:#D97706; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:4px;"><i class="fas fa-paw"></i></div>
      <span style="font-size:11px; font-weight:800;">宠物美容</span>
    </div>
    <div class="cat-btn" id="cbtn_handyman" onclick="selectCategory('handyman')">
      <div style="width:36px; height:36px; border-radius:50%; background:#E0F2FE; color:#0284C7; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:4px;"><i class="fas fa-wrench"></i></div>
      <span style="font-size:11px; font-weight:800;">水电急修</span>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; padding:0 16px;" id="mainGridContainer"></div>

  <nav style="position:fixed; bottom:0; left:0; right:0; height:calc(56px + var(--safe-bottom)); padding-bottom:var(--safe-bottom); background:rgba(255,255,255,0.98); backdrop-filter:blur(16px); display:flex; border-top:1px solid var(--color-border); z-index:120;">
    <div class="dock-cell active" onclick="window.vgoDialog.toast('已在服务大厅')"><i class="fas fa-compass" style="font-size:18px;"></i><span>服务大厅</span></div>
    <div class="dock-cell" onclick="openOrderTrackerModal()"><i class="fas fa-clipboard-check" style="font-size:18px;"></i><span>履约订单</span></div>
    <div class="dock-cell" onclick="triggerSafetySOS()"><i class="fas fa-shield-heart" style="font-size:18px; color:#DB2777;"></i><span>安全守护</span></div>
    <div class="dock-cell" onclick="openAuthModal()"><i class="fas fa-user-shield" style="font-size:18px;"></i><span>客户中心</span></div>
  </nav>

  <div id="configModalOverlay" class="center-modal-scrim">
    <div class="center-modal-box" style="padding:0 18px 20px;">
      <div class="drag-handle-zone"><div class="drag-indicator"></div></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 style="font-size:17px; font-weight:900;" id="cfgTitle">配置服务需求</h3>
        <button onclick="closeConfigModal()" style="border:none; background:none; font-size:24px; color:#94A3B8; cursor:pointer;">&times;</button>
      </div>

      <div id="cfgOptionsMount"></div>

      <div class="pre-entry-waiver-box">
        <div style="font-weight:900; display:flex; align-items:center; gap:6px; margin-bottom:4px;">
          <i class="fas fa-vault"></i> 进门前安全与财物共识知情书
        </div>
        <div>1. 请在手艺人上门前将贵重现金、首饰自行收纳入保险柜。</div>
        <div>2. 阶梯取消政策：下单 5 分钟内免费取消；手艺人接单出发后取消将扣除 <strong>RM 15 / S$ 10</strong> 车马误工补偿款。</div>
        <div style="margin-top:6px; display:flex; align-items:center; gap:6px; font-weight:800; color:#0F172A;">
          <input type="checkbox" id="chkValuablesWaiver" checked style="accent-color:#D97706;">
          <label for="chkValuablesWaiver">我已知悉阶梯取消费用并已妥善保管私人物品</label>
        </div>
      </div>

      <div style="background:#F8FAFC; border:1px solid var(--color-border); border-radius:14px; padding:12px; margin:10px 0;" id="cfgReceiptArea"></div>

      <input type="tel" id="inputPhone" placeholder="您的联系电话 (例: 0128172166)" style="width:100%; min-height:44px; padding:10px 14px; border:1.5px solid var(--color-border); border-radius:12px; font-size:13.5px; outline:none; margin-bottom:8px;">
      <input type="text" id="inputAddr" placeholder="现场详细作业地址 (或指定到店)" style="width:100%; min-height:44px; padding:10px 14px; border:1.5px solid var(--color-border); border-radius:12px; font-size:13.5px; outline:none; margin-bottom:14px;">

      <button class="btn-press" style="width:100%; min-height:48px; background:#0D9488; color:#fff; border:none; border-radius:14px; font-weight:900; font-size:15px;" onclick="goToPaymentModal()">
        签署共识并进入托管支付
      </button>
    </div>
  </div>

  <script src="../core/dialogEngine.js"></script>
  <script src="../core/nativeBridge.js"></script>
  <script src="../core/authEngine.js"></script>
  <script src="../modules/catalogDatabase.js"></script>
  <script src="../modules/pricingEngine.js"></script>
  <script src="../modules/paymentGateway.js"></script>
  <script src="../modules/merchantSyncEngine.js"></script>
  <script src="../modules/advancedSafety.js"></script>
  <script src="../modules/growthEngine.js"></script>
  <script src="../modules/complianceRiskEngine.js"></script>

  <script>
    let currentRegion = 'MY';
    let currentMainMode = 'artisans';
    let currentSkillKey = 'massage';
    let selectedItem = null;

    function renderSubscriptionPlans() {
      const box = document.getElementById('subscriptionStrip');
      const plans = window.vgoRisk.subscriptionPlans || [];
      const cur = currentRegion === 'MY' ? 'RM' : 'S$';

      box.innerHTML = plans.map(p => {
        const price = currentRegion === 'MY' ? p.priceMY : p.priceSG;
        return `
          <div class="sub-plan-card">
            <span class="sub-plan-badge">${p.badge}</span>
            <div>
              <div style="font-size:13.5px; font-weight:900; line-height:1.3; padding-right:50px;">${p.name}</div>
              <div style="font-size:18px; font-weight:900; color:#10B981; margin:6px 0 8px;">${cur} ${price} <small style="font-size:11px; color:#94A3B8; font-weight:600;">/${p.cycle}</small></div>
              <div style="font-size:10.5px; color:#CBD5E1; line-height:1.45;">
                ${p.benefits.map(b => `<div>• ${b}</div>`).join('')}
              </div>
            </div>
            <button class="btn-press" style="margin-top:10px; width:100%; padding:8px; border-radius:10px; background:#0D9488; color:#fff; border:none; font-weight:900; font-size:12px;" onclick="subscribePlanAction('${p.name}', '${cur} ${price}')">
              立即签约开通
            </button>
          </div>
        `;
      }).join('');
    }

    function subscribePlanAction(planName, priceStr) {
      window.vgoDialog.confirm(
        '签约定期维保订阅',
        `确认签约开通【${planName}】？<br>首期资费：<strong style="color:#10B981;">${priceStr}</strong><br>享优先极速派发与专职管家跟踪。`,
        { confirmText: '立即开通', confirmBg: '#0D9488' }
      ).then(ok => {
        if (ok) window.vgoDialog.showModalAlert('签约成功！', `您已成功加入【${planName}】！会员权益与服务券已发放至您的账户包。`, { btnBg: '#0D9488' });
      });
    }

    function switchRegion(region) {
      currentRegion = region;
      window.vgoPricing.setRegion(region);
      document.getElementById('btnMY').classList.toggle('active', region === 'MY');
      document.getElementById('btnSG').classList.toggle('active', region === 'SG');
      renderSubscriptionPlans();
      renderMainGrid();
    }

    function renderMainGrid() {
      const grid = document.getElementById('mainGridContainer');
      const currency = currentRegion === 'MY' ? 'RM' : 'S$';

      let list = window.vgoCatalog[currentSkillKey] || [];
      if (window.vgoSafety.ladiesOnlyActive) {
        list = list.filter(i => (i.artisanName && (i.artisanName.includes('Lisa') || i.artisanName.includes('Queenie') || i.artisanName.includes('姐'))));
      }

      grid.innerHTML = list.map(item => {
        const rawPrice = currentRegion === 'MY' ? item.basePriceMY : item.basePriceSG;
        const quote = window.vgoPricing.calculateDetailedQuote(rawPrice, [], item.category === 'handyman' || item.category === 'airbnbHost');
        return `
          <div class="ergo-sku-box btn-press" onclick="openConfigModal('${item.id}')">
            <div class="sku-img-wrapper">
              <img src="${item.image}" loading="lazy">
              <span class="badge-float-tag">${item.badge}</span>
            </div>
            <div class="sku-details-body">
              <div class="artisan-badge-line">
                <img src="${item.artisanAvatar}">
                <span>${item.artisanName}</span>
              </div>
              <div style="font-size:13px; font-weight:800; margin-bottom:4px;">${item.name}</div>
              <div class="sku-price-strip">
                <span class="sku-price-text">${quote.currency} ${quote.finalTotal}</span>
                <button class="btn-circle-cta"><i class="fas fa-arrow-right"></i></button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openConfigModal(id) {
      let found = null;
      for (const k in window.vgoCatalog) {
        if (Array.isArray(window.vgoCatalog[k])) {
          found = window.vgoCatalog[k].find(x => x.id === id);
          if (found) break;
        }
      }
      if (!found) return;
      selectedItem = found;
      document.getElementById('cfgTitle').innerText = found.name;
      document.getElementById('configModalOverlay').classList.add('active');
    }
    function closeConfigModal() { document.getElementById('configModalOverlay').classList.remove('active'); }

    function goToPaymentModal() {
      const chk = document.getElementById('chkValuablesWaiver').checked;
      if (!chk) {
        window.vgoDialog.toast('请勾选确认知晓阶梯取消费用与财物知情书！', 'warn');
        return;
      }
      closeConfigModal();
      window.vgoDialog.toast('共识签署完成，已为您生成托管支付订单！', 'success');
    }

    function triggerSafetySOS() {
      window.vgoDialog.showModalAlert('Vgo 安全守护中枢', '如遇突发纠纷或人身危险，系统已为您备妥一键上报定位调度。客服热线：01172691788', { btnBg: '#0D9488' });
    }

    function selectCategory(cat) {
      currentSkillKey = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('cbtn_' + cat);
      if (btn) btn.classList.add('active');
      renderMainGrid();
    }

    window.onload = () => {
      renderSubscriptionPlans();
      renderMainGrid();
    };
  </script>
</body>
</html>
