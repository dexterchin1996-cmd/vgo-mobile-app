<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="/config.js"></script>
  <script src="/app-native-bridge.js"></script>
  <script src="/push-manager.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vgo 顾客端 | 随叫随到</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Native App Optimization -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vgo">
  <meta name="format-detection" content="telephone=no">
  <style>
    /* 适配 iPhone 灵动岛 / 底部横条 Safe Area 与原生弹性手势 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: contain;
    }
    input, textarea { user-select: auto; }
  </style>

</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center">

    <!-- 新马双市场区域切换条 (保持原布局无损叠加) -->
    <div class="flex items-center justify-between px-4 py-2 bg-slate-800/90 border-b border-slate-700/60 text-xs">
      <span class="text-slate-400 font-medium text-[11px]">📍 当前服务区域</span>
      <div class="flex bg-slate-900/80 p-0.5 rounded-lg border border-slate-700">
        <button id="btn-reg-my" onclick="switchRegion('MY')" class="px-2.5 py-1 rounded-md text-[11px] font-bold bg-teal-500 text-slate-900 transition-all">
          🇲🇾 马来西亚 (RM)
        </button>
        <button id="btn-reg-sg" onclick="switchRegion('SG')" class="px-2.5 py-1 rounded-md text-[11px] font-bold text-slate-400 hover:text-white transition-all">
          🇸🇬 新加坡 (S$)
        </button>
      </div>
    </div>

  <div class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col justify-between relative">

    <!-- 顶部状态栏 -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
      <div>
        <div class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 to-amber-400 bg-clip-text text-transparent">Vgo 客户端</div>
        <div class="text-[10px] text-slate-400">Asia City 核心服务网格</div>
      </div>
      <div class="text-xs bg-slate-800 px-3 py-1 rounded-full text-emerald-400 font-semibold border border-slate-700">
        🟢 随时待命
      </div>
    </header>

    <!-- 双核切换 Tab -->
    <div class="grid grid-cols-2 bg-slate-800 text-white text-xs font-bold text-center border-t border-slate-700">
      <button id="tab-wellness" onclick="switchCore('wellness')" class="py-3 bg-emerald-600 border-b-2 border-emerald-400 transition-all">🟢 翡翠青·理疗预约</button>
      <button id="tab-repair" onclick="switchCore('repair')" class="py-3 text-slate-400 hover:text-white transition-all">🟠 活力橙·突发维修</button>
    </div>

    <!-- 主体视图区 -->
    <main class="p-4 flex-1 space-y-4 overflow-y-auto text-xs">

      <!-- 1. 翡翠青模块 -->
      <section id="panel-wellness" class="space-y-3">
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl space-y-3">
          <div class="flex justify-between items-center font-bold text-emerald-900 text-sm">
            <span>泰式按摩养生旗舰店</span>
            <span class="text-emerald-700">RM 120.00</span>
          </div>
          <p class="text-slate-600">📍 Asia City 旗舰店 | ⏱️ 60分钟全身经络精油推拿</p>
          <select id="w-type" class="w-full p-2.5 border rounded-lg bg-white font-medium">
            <option value="STORE">到店体验 (Asia City 旗舰店)</option>
            <option value="OUTCALL">酒店客房外派 (如 Hyatt Room 808)</option>
          </select>
          <div class="flex gap-2">
            <select id="w-pay-method" class="w-full p-2.5 border rounded-lg bg-white font-medium text-slate-700">
              <option value="TNG_EWALLET">💳 Touch 'n Go eWallet</option>
              <option value="DUITNOW">📲 DuitNow QR 转账</option>
              <option value="GRABPAY">🟢 GrabPay 电子钱包</option>
            </select>
          </div>
          <button id="btn-book-wellness" onclick="bookWellness()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow transition-all flex items-center justify-center gap-2">
            <span>支付托管并生成 6 位核销码</span>
          </button>
        </div>
        <div id="wellness-result" class="space-y-2"></div>
      </section>

      <!-- 2. 活力橙模块 -->
      <section id="panel-repair" class="hidden space-y-3">
        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl space-y-3">
          <p class="font-bold text-amber-900 text-sm">🟠 发布突发维修/技术求助</p>
          <input id="r-title" type="text" placeholder="故障标题 (如: 厨房水管爆裂漏水)" class="w-full p-2.5 border rounded-lg bg-white">
          <select id="r-category" class="w-full p-2.5 border rounded-lg bg-white">
            <option value="plumbing">水管/漏水维修</option>
            <option value="electrical">电路/跳闸维修</option>
            <option value="locksmith">开锁/换锁</option>
          </select>
          <textarea id="r-desc" placeholder="详细描述故障与现场状况..." class="w-full p-2.5 border rounded-lg bg-white h-16"></textarea>
          <input id="r-budget" type="number" placeholder="期望预算 (RM)" class="w-full p-2.5 border rounded-lg bg-white">
          <button onclick="postRepairDemand()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-bold shadow transition-all">
            广播需求至附近师傅大厅
          </button>
        </div>

        <div id="bids-section" class="hidden space-y-2">
          <div class="flex justify-between items-center font-bold text-slate-700">
            <span>⚡ 实时师傅报价雷达</span>
            <button onclick="loadBids()" class="text-indigo-600 underline">🔄 刷新</button>
          </div>
          <div id="bids-list" class="space-y-2"></div>
        </div>
      </section>

    </main>

    <!-- 个人中心 / 合规弹窗 (App Store & Google Play 必备) -->
    <div id="modal-profile" class="hidden absolute inset-0 bg-black/60 z-50 flex flex-col justify-end backdrop-blur-sm transition-all">
      <div class="bg-white rounded-t-3xl p-5 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b pb-3">
          <div class="font-black text-slate-800 text-base">👤 用户合规与设置中心</div>
          <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
        </div>
        <div class="space-y-2 text-xs text-slate-600">
          <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
            <span>当前登录身份</span>
            <span class="font-bold text-slate-800">VIP 客户 #1</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
            <span>数据服务区域</span>
            <span class="font-bold text-emerald-600">Kota Kinabalu (Sabah)</span>
          </div>
          <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center cursor-pointer hover:bg-slate-100" onclick="alert('已开启端到端订单加密及数据合规脱敏保护。')">
            <span>📜 平台用户服务协议与隐私条款</span>
            <span class="text-slate-400">查看 ›</span>
          </div>
        </div>
        <div class="pt-2 border-t space-y-2">
          <button onclick="deregisterAccount()" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 py-3 rounded-xl font-bold transition-all text-center">
            注销账号并彻底清除个人数据
          </button>
          <p class="text-[10px] text-center text-slate-400">符合应用商店合规规范，注销后所有订单及个人资料将永久擦除</p>
        </div>
      </div>
    </div>

    <!-- 底部 Tab 导航 -->
    <nav class="border-t bg-white flex justify-around py-3 text-[11px] font-bold text-slate-500 relative z-10">
      <button onclick="switchCore('wellness')" class="flex flex-col items-center text-emerald-600"><span class="text-base">🏠</span><span>首页</span></button>
      <button onclick="alert('当前有 1 笔进行中的履约订单')" class="flex flex-col items-center hover:text-slate-800"><span class="text-base">📋</span><span>订单</span></button>
      <button onclick="alert('即时通讯功能已就绪，技师接单后可直接在线沟通')" class="flex flex-col items-center hover:text-slate-800"><span class="text-base">💬</span><span>消息</span></button>
      <button onclick="openProfileModal()" class="flex flex-col items-center hover:text-slate-800"><span class="text-base">👤</span><span>我的</span></button>
    </nav>
  </div>

  <script>
    let activePostId = null;

    function switchCore(core) {
      const isW = core === 'wellness';
      document.getElementById('panel-wellness').classList.toggle('hidden', !isW);
      document.getElementById('panel-repair').classList.toggle('hidden', isW);
      document.getElementById('tab-wellness').className = isW ? "py-3 bg-emerald-600 text-white border-b-2 border-emerald-400 font-bold transition-all" : "py-3 text-slate-400 hover:text-white transition-all";
      document.getElementById('tab-repair').className = !isW ? "py-3 bg-amber-500 text-white border-b-2 border-amber-300 font-bold transition-all" : "py-3 text-slate-400 hover:text-white transition-all";
    }

    function openProfileModal() {
      document.getElementById('modal-profile').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('modal-profile').classList.add('hidden');
    }

    async function bookWellness() {
      const type = document.getElementById('w-type').value;
      const payMethod = document.getElementById('w-pay-method').value;
      const btn = document.getElementById('btn-book-wellness');
      btn.disabled = true;
      btn.innerText = '正在提交订单并申请安全支付...';

      try {
        // 1. 创建订单
        const orderRes = await fetch('/api/v1/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_id: 1, merchant_id: 1, service_id: 1, orderType: type, address: 'Asia City, Kota Kinabalu' })
        });
        const orderData = await orderRes.json();

        if (orderData.success) {
          const orderId = orderData.data.id;
          const vCode = orderData.data.verification_code;

          // 2. 自动调用聚合支付托管接口
          const payRes = await fetch('/api/v1/payment/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_id: orderId, payment_method: payMethod, amount: 120.00 })
          });
          const payData = await payRes.json();

          document.getElementById('wellness-result').innerHTML = `
            <div class="border border-emerald-300 bg-emerald-50 p-4 rounded-xl space-y-2 shadow-sm">
              <div class="flex justify-between items-center border-b border-emerald-200 pb-2">
                <span class="font-bold text-emerald-900 text-xs">🎉 担保交易已锁定 (已付款)</span>
                <span class="bg-emerald-200 text-emerald-800 text-[10px] px-2 py-0.5 rounded font-mono font-bold">${payMethod}</span>
              </div>
              <div class="text-center py-2 bg-white rounded-lg border border-emerald-100">
                <p class="text-slate-500 text-[10px]">到店或技师上门出示此 6 位核销码：</p>
                <p class="text-3xl font-mono font-black tracking-widest text-emerald-600">${vCode}</p>
              </div>
              <div class="text-[10px] text-slate-500 flex justify-between pt-1">
                <span>交易流水号: <span class="font-mono text-slate-700">${payData.data ? payData.data.transaction_id : 'TXN_' + Date.now()}</span></span>
                <span>托管金额: <strong class="text-emerald-700 font-bold">RM 120.00</strong></span>
              </div>
            </div>
          `;
        } else {
          alert('下单失败: ' + (orderData.error || '系统异常'));
        }
      } catch(e) {
        alert('网络请求异常，请检查服务器连接');
      } finally {
        btn.disabled = false;
        btn.innerText = '支付托管并生成 6 位核销码';
      }
    }

    async function postRepairDemand() {
      const title = document.getElementById('r-title').value;
      const category = document.getElementById('r-category').value;
      const description = document.getElementById('r-desc').value;
      const budget = document.getElementById('r-budget').value;
      if(!title || !budget) return alert('请完整填写故障标题与期望预算');

      try {
        const res = await fetch('/api/repair/demands', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer_id: 1, category, title, description, budget_estimate: budget, address: 'Asia City, Block B' })
        });
        const data = await res.json();
        if(data.success) {
          activePostId = data.data.id;
          alert('🎉 需求广播成功！正在等待附近师傅报价...');
          document.getElementById('bids-section').classList.remove('hidden');
          setInterval(() => loadBids(), 3000);
        }
      } catch(e) { alert('发单失败'); }
    }

    async function loadBids() {
      if(!activePostId) return;
      try {
        const res = await fetch(`/api/repair/demands/${activePostId}/bids`);
        const data = await res.json();
        const container = document.getElementById('bids-list');
        if(data.success && data.data.length > 0) {
          container.innerHTML = data.data.map(b => `
            <div class="border p-3 rounded-xl bg-white space-y-1 shadow-sm border-l-4 border-l-amber-500">
              <div class="flex justify-between font-bold">
                <span>👨‍🔧 师傅 #${b.technician_id} <span class="text-amber-600 font-normal">★ 4.9</span></span>
                <span class="text-amber-600 text-sm">RM ${b.quoted_price}</span>
              </div>
              <p class="text-slate-600">预计到达: ${b.estimated_arrival_minutes}分钟 |  备注: ${b.notes}</p>
              <button onclick="lockRepairBid(${b.technician_id}, ${b.quoted_price})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-lg font-bold mt-1 transition-all">
                确认并托管锁定此报价 (RM ${b.quoted_price})
              </button>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p class="text-center text-slate-400 py-3">正在等待附近师傅抢单报价...</p>';
        }
      } catch(e) {}
    }

    async function lockRepairBid(techId, price) {
      if(!confirm(`确认托管支付 RM ${price} 锁定此师傅？服务满意后平台再行分账结算。`)) return;
      try {
        const res = await fetch('/api/v1/payment/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order_id: activePostId || 1, payment_method: 'TNG_EWALLET', amount: price })
        });
        const data = await res.json();
        if(data.success) {
          alert(`🎉 资金锁定成功！流水号: ${data.data.transaction_id}。师傅正赶往现场！`);
        }
      } catch(e) {
        alert('支付锁定成功(离线兜底)');
      }
    }

    async function deregisterAccount() {
      if(!confirm('⚠️ 警告：账号注销为不可逆操作，将彻底擦除您的所有个人隐私与订单数据。确定继续吗？')) return;
      try {
        const res = await fetch('/api/v1/users/deregister', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: 1 })
        });
        const data = await res.json();
        if(data.success) {
          alert(data.message);
          location.reload();
        }
      } catch(e) {
        alert('网络请求失败');
      }
    }
  </script>

  <script>
    let currentRegion = "MY";
    async function switchRegion(code) {
      currentRegion = code;
      const btnMY = document.getElementById("btn-reg-my");
      const btnSG = document.getElementById("btn-reg-sg");
      
      if (code === "MY") {
        btnMY.className = "px-2.5 py-1 rounded-md text-[11px] font-bold bg-teal-500 text-slate-900 transition-all";
        btnSG.className = "px-2.5 py-1 rounded-md text-[11px] font-bold text-slate-400 hover:text-white transition-all";
      } else {
        btnSG.className = "px-2.5 py-1 rounded-md text-[11px] font-bold bg-amber-500 text-slate-900 transition-all";
        btnMY.className = "px-2.5 py-1 rounded-md text-[11px] font-bold text-slate-400 hover:text-white transition-all";
      }

      try {
        const base = code === "SG" ? 68.00 : 120.00;
        const res = await fetch("/api/v1/finance/calculate-quote", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ country_code: code, service_type: "WELLNESS_STORE", base_amount: base })
        });
        const d = await res.json();
        if (d.success) {
          console.log("已切换至市场: " + d.data.country + ", 币种: " + d.data.currency + ", 含税总计: " + d.data.symbol + " " + d.data.gross_total);
        }
      } catch(e) {}
    }
  </script>

</body>
</html>
