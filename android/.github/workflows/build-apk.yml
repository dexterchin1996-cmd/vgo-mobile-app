name: Build Vgo Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出项目代码
        uses: actions/checkout@v4

      - name: 配置 Java 17 编译环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目与 Capacitor 核心依赖
        run: |
          npm install --legacy-peer-deps

      - name: 同步前端资产到原生 Android 工程
        run: |
          npx cap sync android

      - name: 赋予 Gradle 执行权限
        run: |
          cd android
          chmod +x ./gradlew

      - name: 云端编译生成 APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 导出并上传 APK 文件到云端交付区
        uses: actions/upload-artifact@v4
        with:
          name: Vgo-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
